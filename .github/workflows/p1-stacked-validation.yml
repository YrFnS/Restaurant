name: P1 Stacked Validation

on:
  pull_request:
    branches:
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: p1-stacked-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-timekeeping:
    name: Apply immutable timekeeping application wiring
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed timekeeping wiring when required
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.head.ref }}" != "agent/p1-employee-timekeeping" ]; then
            echo "No timekeeping wiring required for this branch."
            exit 0
          fi
          if [ ! -f .github/workflows/agent-timekeeping-wiring.yml ]; then
            echo "Timekeeping wiring source is unavailable or already removed."
            exit 0
          fi

          # Complete the purchasing enum catalog inherited by this stacked branch.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/integration/p1-domain-integrity.ts')
          text = path.read_text()

          old = '  PaymentStatus,\n  PrismaClient,'
          new = '  PaymentStatus,\n  PurchaseOrderStatus,\n  PurchaseReceiptStatus,\n  PrismaClient,'
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected purchase enum import anchor was not found')
              text = text.replace(old, new, 1)

          old = '  StaffRole,\n  TableShape,'
          new = '  StaffRole,\n  SupplierStatus,\n  TableShape,'
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected supplier enum import anchor was not found')
              text = text.replace(old, new, 1)

          old = '  PaymentEventStatus: ["pending", "succeeded", "failed", "voided"],\n};'
          new = '''  PaymentEventStatus: ["pending", "succeeded", "failed", "voided"],
  SupplierStatus: ["active", "inactive"],
  PurchaseOrderStatus: [
    "draft",
    "submitted",
    "partially_received",
    "received",
    "cancelled",
  ],
  PurchaseReceiptStatus: ["posted", "reversed"],
};'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected purchase enum catalog anchor was not found')
              text = text.replace(old, new, 1)

          old = '  assert.equal(PaymentEventStatus.failed, "failed");\n}'
          new = '''  assert.equal(PaymentEventStatus.failed, "failed");
  assert.equal(SupplierStatus.active, "active");
  assert.equal(PurchaseOrderStatus.partially_received, "partially_received");
  assert.equal(PurchaseReceiptStatus.reversed, "reversed");
}'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected purchase enum round-trip anchor was not found')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          # Extract and run the reviewed deterministic integration patch.
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-timekeeping-wiring.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = []
          for line in workflow[start:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-timekeeping-wiring.py').write_text('\n'.join(script) + '\n')
          PY

          python3 /tmp/apply-timekeeping-wiring.py

          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            prisma/schema.prisma \
            prisma/migrations/20260731235970_add_employee_timekeeping/migration.sql \
            src/lib/db.ts \
            package.json \
            src/components/admin/tabs/SettingsTab.tsx \
            src/app/api/settings/route.ts \
            'src/app/api/employees/[id]/route.ts' \
            src/app/api/employees/clock/route.ts \
            src/lib/timekeeping/timekeeping.ts \
            tests/integration/p0-login-lockout.ts \
            tests/integration/p1-employee-timekeeping.ts \
            tests/integration/p1-domain-integrity.ts \
            docs/REMEDIATION_PLAN.md

          if git diff --cached --quiet; then
            echo "Timekeeping application wiring is already applied."
            exit 0
          fi

          git commit -m "feat: integrate immutable employee timekeeping"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  validate:
    needs: patch-timekeeping
    name: Typecheck, tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: "postgresql://validation:validation@127.0.0.1:5432/restaurant?sslmode=disable"
      AUTH_SECRET: "validation-session-secret-0123456789abcdef0123456789abcdef"
      AUTH_PIN_PEPPER: "validation-pin-pepper-0123456789abcdef0123456789abcdef"
      AUTH_ORDER_ACCESS_SECRET: "validation-order-access-0123456789abcdef0123456789abcdef"
      AUTH_CUSTOMER_ACCESS_SECRET: "validation-customer-access-0123456789abcdef0123456789abcdef"
      RATE_LIMIT_SECRET: "validation-rate-limit-secret-0123456789abcdef0123456789abcdef"
      AUTH_SESSION_IDLE_SECONDS: "1800"
      APP_ALLOWED_ORIGINS: ""
      NEXTAUTH_SECRET: "validation-nextauth-secret-0123456789abcdef0123456789abcdef"
      NEXTAUTH_URL: "http://localhost:3000"
      KDS_REALTIME_URL: "http://127.0.0.1:3003/broadcast"
      NEXT_PUBLIC_KDS_PORT: "3003"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Lint
        run: bun run lint

      - name: Production build
        env:
          NODE_ENV: production
        run: bun run build

  integration:
    needs: patch-timekeeping
    name: Database-backed restaurant suite
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: restaurant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d restaurant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: "true"
      DATABASE_URL: "postgresql://integration:integration@127.0.0.1:5432/restaurant?sslmode=disable"
      AUTH_SECRET: "integration-session-secret-0123456789abcdef0123456789abcdef"
      AUTH_PIN_PEPPER: "integration-pin-pepper-0123456789abcdef0123456789abcdef"
      AUTH_ORDER_ACCESS_SECRET: "integration-order-access-0123456789abcdef0123456789abcdef"
      AUTH_CUSTOMER_ACCESS_SECRET: "integration-customer-access-0123456789abcdef0123456789abcdef"
      RATE_LIMIT_SECRET: "integration-rate-limit-secret-0123456789abcdef0123456789abcdef"
      KDS_OUTBOX_SECRET: "integration-kds-outbox-secret-0123456789abcdef0123456789abcdef"
      AUTH_SESSION_TTL_SECONDS: "28800"
      AUTH_SESSION_IDLE_SECONDS: "1800"
      APP_ALLOWED_ORIGINS: "http://127.0.0.1:3000"
      NEXTAUTH_SECRET: "integration-nextauth-secret-0123456789abcdef0123456789abcdef"
      NEXTAUTH_URL: "http://127.0.0.1:3000"
      KDS_REALTIME_URL: "http://127.0.0.1:3003/broadcast"
      NEXT_PUBLIC_KDS_PORT: "3003"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Deploy committed migrations
        run: bun run db:deploy

      - name: Seed and verify exact values
        run: |
          bun run db:seed
          bun run auth:check-pins
          bun run money:check

      - name: Build production server
        env:
          NODE_ENV: production
        run: bun run build

      - name: Run database-backed test suite
        shell: bash
        run: |
          set -euo pipefail

          bun tests/integration/kds-mock.ts > /tmp/kds-mock.log 2>&1 &
          kds_pid=$!
          PORT=3000 NODE_ENV=production bun .next/standalone/server.js > /tmp/p1-server.log 2>&1 &
          server_pid=$!

          cleanup() {
            status=$?
            kill "$server_pid" "$kds_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            wait "$kds_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo "--- production server log ---"
              cat /tmp/p1-server.log || true
              echo "--- KDS mock log ---"
              cat /tmp/kds-mock.log || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3003/health >/dev/null; then
              break
            fi
            if ! kill -0 "$kds_pid" 2>/dev/null; then
              cat /tmp/kds-mock.log || true
              exit 1
            fi
            sleep 1
          done

          app_ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/api >/dev/null; then
              app_ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/p1-server.log || true
              exit 1
            fi
            sleep 1
          done
          test "$app_ready" -eq 1

          P0_BASE_URL=http://127.0.0.1:3000 bun run test:integration
          bun run money:check

  existing-data-rehearsal:
    needs: patch-timekeeping
    name: Existing-data adoption rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy
          POSTGRES_DB: restaurant_legacy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legacy -d restaurant_legacy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: "true"
      DATABASE_URL: "postgresql://legacy:legacy@127.0.0.1:5432/restaurant_legacy?sslmode=disable"
      AUTH_SECRET: "legacy-session-secret-0123456789abcdef0123456789abcdef"
      AUTH_PIN_PEPPER: "legacy-pin-pepper-0123456789abcdef0123456789abcdef"
      AUTH_ORDER_ACCESS_SECRET: "legacy-order-access-0123456789abcdef0123456789abcdef"
      AUTH_CUSTOMER_ACCESS_SECRET: "legacy-customer-access-0123456789abcdef0123456789abcdef"
      RATE_LIMIT_SECRET: "legacy-rate-limit-secret-0123456789abcdef0123456789abcdef"
      KDS_OUTBOX_SECRET: "legacy-kds-outbox-secret-0123456789abcdef0123456789abcdef"

    steps:
      - name: Check out repository with main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Recreate legacy database and representative data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          git show origin/main:prisma/schema.prisma > .tmp/legacy-schema.prisma
          bunx prisma generate --schema .tmp/legacy-schema.prisma
          bunx prisma db execute \
            --file prisma/migrations/20260730000000_baseline/migration.sql \
            --schema .tmp/legacy-schema.prisma
          git show origin/main:prisma/seed.ts > .tmp/legacy-seed.ts
          bun .tmp/legacy-seed.ts
          bun tests/integration/p0-existing-data-rehearsal.ts \
            snapshot /tmp/p1-existing-data.json

      - name: Adopt baseline and deploy additive migrations
        shell: bash
        run: |
          set -euo pipefail
          bun run db:generate
          bunx prisma migrate resolve \
            --applied 20260730000000_baseline \
            --schema prisma/schema.prisma
          bun run db:deploy
          bunx prisma migrate status --schema prisma/schema.prisma

      - name: Verify credentials and data preservation
        shell: bash
        run: |
          set -euo pipefail
          bun run auth:migrate-pins
          bun run auth:check-pins
          bun tests/integration/p0-existing-data-rehearsal.ts \
            verify /tmp/p1-existing-data.json
          bun tests/integration/p1-domain-integrity.ts
          bun run money:check
