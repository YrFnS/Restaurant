name: Reconcile reservation roadmap PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.pull_request.head.ref == 'agent/p1-reservation-availability' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconcile roadmap and validation record
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconcile-reservation-roadmap.py
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REMEDIATION_PLAN.md docs/P1_RESERVATION_AVAILABILITY.md
          if git diff --cached --quiet; then
            echo "Reservation roadmap is already reconciled."
            exit 0
          fi
          git commit -m "docs: reconcile reservation roadmap and validation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
