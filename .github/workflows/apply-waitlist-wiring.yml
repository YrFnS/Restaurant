name: Apply waitlist schema and regression wiring

on:
  push:
    branches:
      - agent/p1-waitlist-operations

permissions:
  contents: write

concurrency:
  group: apply-waitlist-wiring
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'feat: complete waitlist repository wiring' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-waitlist-operations
          fetch-depth: 0

      - name: Apply reviewed waitlist wiring
        shell: bash
        run: |
          set -euo pipefail

          if grep -q 'waitlistAverageTurnoverMinutes' prisma/schema.prisma \
            && grep -q '"waitlist"' src/components/admin/AdminShell.tsx \
            && grep -q 'p1-waitlist-operations.ts' package.json; then
            echo "Waitlist repository wiring is already applied."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Missing patch marker in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          # Prisma mappings for the additive waitlist migration.
          replace_once(
              "prisma/schema.prisma",
              '''  reservationCustomerCancelCutoffMinutes   Int      @default(120)
  logoUrl                                  String   @default("")''',
              '''  reservationCustomerCancelCutoffMinutes   Int      @default(120)
  waitlistEnabled                         Boolean  @default(true)
  waitlistAverageTurnoverMinutes          Int      @default(75)
  waitlistNotificationExpiryMinutes       Int      @default(10)
  waitlistEstimatePaddingMinutes          Int      @default(5)
  waitlistMaxQuoteMinutes                 Int      @default(240)
  waitlistRequireConfirmation             Boolean  @default(true)
  logoUrl                                  String   @default("")''',
          )
          replace_once(
              "prisma/schema.prisma",
              '''  orders       Order[]
  reservations Reservation[]
  createdAt    DateTime      @default(now())''',
              '''  orders          Order[]
  reservations    Reservation[]
  waitlistEntries WaitlistEntry[]
  createdAt       DateTime      @default(now())''',
          )
          replace_once(
              "prisma/schema.prisma",
              '''model WaitlistEntry {
  id            String         @id @default(cuid())
  customerName  String
  customerPhone String
  partySize     Int
  status        WaitlistStatus @default(waiting)
  estimatedWait Int            @default(15)
  notes         String?
  customerId    String?
  customer      Customer?      @relation(fields: [customerId], references: [id])
  seatedAt      DateTime?
  notifiedAt    DateTime?
  createdAt     DateTime       @default(now())
  updatedAt     DateTime       @updatedAt
}''',
              '''model WaitlistEntry {
  id                      String             @id @default(cuid())
  idempotencyKey          String?            @unique(map: "WaitlistEntry_idempotencyKey_key")
  customerName            String
  customerPhone           String
  partySize               Int
  status                  WaitlistStatus     @default(waiting)
  estimatedWait           Int                @default(15)
  notes                   String?
  customerId              String?
  customer                Customer?          @relation(fields: [customerId], references: [id])
  source                   ReservationSource @default(customer)
  preference               String?
  tableId                  String?
  table                    RestaurantTable?  @relation(fields: [tableId], references: [id], onDelete: SetNull)
  estimatedSeatAt          DateTime?          @db.Timestamptz(3)
  estimateCalculatedAt     DateTime?          @db.Timestamptz(3)
  seatedAt                 DateTime?          @db.Timestamptz(3)
  notifiedAt               DateTime?          @db.Timestamptz(3)
  notificationExpiresAt    DateTime?          @db.Timestamptz(3)
  notificationConfirmedAt  DateTime?          @db.Timestamptz(3)
  cancelledAt              DateTime?          @db.Timestamptz(3)
  noShowAt                 DateTime?          @db.Timestamptz(3)
  createdAt                DateTime           @default(now())
  updatedAt                DateTime           @updatedAt

  @@index([status, estimatedSeatAt, createdAt], map: "WaitlistEntry_status_estimatedSeatAt_idx")
  @@index([tableId, status, notificationExpiresAt], map: "WaitlistEntry_table_status_idx")
  @@index([customerId, createdAt(sort: Desc)], map: "WaitlistEntry_customer_createdAt_idx")
}''',
          )

          # Add the host console to the role-aware admin shell.
          replace_once(
              "src/components/admin/AdminShell.tsx",
              '''  ShieldAlert,
} from "lucide-react";''',
              '''  ShieldAlert,
  Hourglass,
} from "lucide-react";''',
          )
          replace_once(
              "src/components/admin/AdminShell.tsx",
              '''import { ReservationsTab } from "./tabs/ReservationsTab";
import { StaffTab } from "./tabs/StaffTab";''',
              '''import { ReservationsTab } from "./tabs/ReservationsTab";
import { WaitlistTab } from "./tabs/WaitlistTab";
import { StaffTab } from "./tabs/StaffTab";''',
          )
          replace_once(
              "src/components/admin/AdminShell.tsx",
              '''  | "reservations"
  | "staff"''',
              '''  | "reservations"
  | "waitlist"
  | "staff"''',
          )
          replace_once(
              "src/components/admin/AdminShell.tsx",
              '''  reservations: ReservationsTab,
  staff: StaffTab,''',
              '''  reservations: ReservationsTab,
  waitlist: WaitlistTab,
  staff: StaffTab,''',
          )
          replace_once(
              "src/components/admin/AdminShell.tsx",
              '''      {
        id: "reservations",
        label: t.admin.reservations,
        icon: <CalendarCheck className="size-[18px]" />,
        roles: RESERVATION_MANAGEMENT_ROLES,
      },
      {
        id: "staff",''',
              '''      {
        id: "reservations",
        label: t.admin.reservations,
        icon: <CalendarCheck className="size-[18px]" />,
        roles: RESERVATION_MANAGEMENT_ROLES,
      },
      {
        id: "waitlist",
        label: isRTL ? "قائمة الانتظار" : "Waitlist",
        icon: <Hourglass className="size-[18px]" />,
        roles: RESERVATION_MANAGEMENT_ROLES,
      },
      {
        id: "staff",''',
          )

          # Keep exact policy values in both public and staff DTOs.
          replace_once(
              "src/lib/waitlist/operations.ts",
              '''    averageTurnoverMinutes: policy.averageTurnoverMinutes,
    notificationExpiryMinutes: policy.notificationExpiryMinutes,
    requireConfirmation: policy.requireConfirmation,''',
              '''    averageTurnoverMinutes: policy.averageTurnoverMinutes,
    notificationExpiryMinutes: policy.notificationExpiryMinutes,
    estimatePaddingMinutes: policy.estimatePaddingMinutes,
    maxQuoteMinutes: policy.maxQuoteMinutes,
    requireConfirmation: policy.requireConfirmation,''',
          )

          # Idempotent retries are returned even when service later closes or policy changes.
          operations = Path("src/lib/waitlist/operations.ts")
          operations_text = operations.read_text()
          replay_start = operations_text.index(
              '  const replay = await readWaitlistEntryByKey(tx, key);',
              operations_text.index('export async function createWaitlistEntry('),
          )
          replay_end = operations_text.index(
              '\n\n  const duplicates = await tx.$queryRaw', replay_start
          )
          replay_block = operations_text[replay_start:replay_end]
          operations_text = operations_text[:replay_start] + operations_text[replay_end:]
          policy_marker = '  const policy = await readWaitlistPolicy(tx);'
          policy_index = operations_text.index(
              policy_marker,
              operations_text.index('export async function createWaitlistEntry('),
          )
          operations_text = (
              operations_text[:policy_index]
              + replay_block
              + '\n\n'
              + operations_text[policy_index:]
          )
          operations.write_text(operations_text)

          # Use every policy value returned by the server in the host UI.
          replace_once(
              "src/components/admin/tabs/WaitlistTab.tsx",
              '''  notificationExpiryMinutes: number;
  requireConfirmation: boolean;''',
              '''  notificationExpiryMinutes: number;
  estimatePaddingMinutes: number;
  maxQuoteMinutes: number;
  requireConfirmation: boolean;''',
          )
          replace_once(
              "src/components/admin/tabs/WaitlistTab.tsx",
              '''      estimatePaddingMinutes: 5,
      maxQuoteMinutes: 240,''',
              '''      estimatePaddingMinutes: query.data.policy.estimatePaddingMinutes,
      maxQuoteMinutes: query.data.policy.maxQuoteMinutes,''',
          )
          replace_once(
              "src/components/admin/tabs/WaitlistTab.tsx",
              '''        estimatePaddingMinutes: policyForm.estimatePaddingMinutes,
        maxQuoteMinutes: policyForm.maxQuoteMinutes,''',
              '''        estimatePaddingMinutes: result.policy.estimatePaddingMinutes,
        maxQuoteMinutes: result.policy.maxQuoteMinutes,''',
          )

          # Permanent route classification for the new worker and reviewed DTOs.
          replace_once(
              "tests/security/route-auth-inventory.test.ts",
              '''  "POST /api/internal/kds-outbox": {
    markers: ["configuredSecret", "secretsMatch", "flushKdsOutbox"],
  },''',
              '''  "POST /api/internal/kds-outbox": {
    markers: ["configuredSecret", "secretsMatch", "flushKdsOutbox"],
  },
  "POST /api/internal/waitlist": {
    markers: ["configuredSecret", "secretsMatch", "refreshWaitlist"],
  },''',
          )
          replace_once(
              "tests/security/route-auth-inventory.test.ts",
              '''      "consumeRateLimit",
      "createCustomerAccessToken",''',
              '''      "consumeRateLimit",
      "idempotency-key",
      "createWaitlistEntry",
      "createCustomerAccessToken",''',
          )
          replace_once(
              "tests/security/route-read-inventory.test.ts",
              '''  "GET /api/internal/kds-outbox": {
    markers: [
      "configuredSecret",
      "secretsMatch",
      "processOutbox(request)",
      "flushKdsOutbox",
    ],
    markerScope: "source",
  },''',
              '''  "GET /api/internal/kds-outbox": {
    markers: [
      "configuredSecret",
      "secretsMatch",
      "processOutbox(request)",
      "flushKdsOutbox",
    ],
    markerScope: "source",
  },
  "GET /api/internal/waitlist": {
    markers: [
      "configuredSecret",
      "secretsMatch",
      "processWaitlist(request)",
      "refreshWaitlist",
    ],
    markerScope: "source",
  },''',
          )
          replace_once(
              "tests/security/route-read-inventory.test.ts",
              '''      "verifyCustomerAccessToken",
      "waitingCount",
      "select: {",''',
              '''      "verifyCustomerAccessToken",
      "waitingCount",
      "serializeWaitlistForCustomer",
      "safeWaitlistPolicy",''',
          )

          # Preserve the complete integration chain and worker secret.
          package = Path("package.json")
          package_text = package.read_text()
          marker = 'bun tests/integration/p1-reservation-availability.ts"'
          if marker not in package_text:
              raise SystemExit("Waitlist integration package marker not found")
          package.write_text(
              package_text.replace(
                  marker,
                  'bun tests/integration/p1-reservation-availability.ts && bun tests/integration/p1-waitlist-operations.ts"',
                  1,
              )
          )

          workflow = Path(".github/workflows/p0-integration.yml")
          workflow_text = workflow.read_text()
          secret_line = '      KDS_OUTBOX_SECRET: "integration-kds-outbox-secret-0123456789abcdef0123456789abcdef"'
          if secret_line not in workflow_text:
              raise SystemExit("Integration secret marker not found")
          workflow.write_text(
              workflow_text.replace(
                  secret_line,
                  secret_line + '\n      WAITLIST_WORKER_SECRET: "integration-waitlist-worker-secret-0123456789abcdef0123456789abcdef"',
                  1,
              )
          )

          # Make the old customer-isolation test use the reviewed contract and
          # an all-day test service schedule, independent of CI wall-clock time.
          customer_test = Path("tests/integration/p0-customer-isolation.ts")
          customer = customer_test.read_text()
          customer = customer.replace(
              '''  const result = await request("/api/waitlist", {
    method: "POST",
    body: JSON.stringify({''',
              '''  const result = await request("/api/waitlist", {
    method: "POST",
    headers: {
      "Idempotency-Key": `p0-customer-waitlist-${crypto.randomUUID()}`,
    },
    body: JSON.stringify({''',
              1,
          )
          customer = customer.replace(
              'body: JSON.stringify({ status: "cancelled" })',
              'body: JSON.stringify({ action: "cancel" })',
          )
          waitlist_log = '  console.log("[p0-customer] validating waitlist token and resource isolation");'
          if waitlist_log not in customer:
              raise SystemExit("Customer-isolation waitlist marker not found")
          customer = customer.replace(
              waitlist_log,
              '''  await db.reservationServicePeriod.deleteMany();
  for (let dayOfWeek = 0; dayOfWeek <= 6; dayOfWeek += 1) {
    await db.reservationServicePeriod.create({
      data: {
        dayOfWeek,
        opensAtMinute: 0,
        closesAtMinute: 1439,
        label: "P0 waitlist integration service",
        isActive: true,
      },
    });
  }
  await db.restaurantSettings.update({
    where: { id: "1" },
    data: { waitlistEnabled: true },
  });

  console.log("[p0-customer] validating waitlist token and resource isolation");''',
              1,
          )
          customer_test.write_text(customer)

          # The migration deliberately recalculates legacy notifications because
          # the previous schema did not contain a table hold.
          design = Path("docs/P1_WAITLIST_OPERATIONS.md")
          design_text = design.read_text()
          design_text = design_text.replace(
              '''Existing entries are adopted additively. Existing notified entries are treated as already confirmed so migration does not strand them behind the new confirmation rule.''',
              '''Existing entries are adopted additively. Legacy notified entries return to `waiting` for a fresh estimate because the previous schema did not contain a trustworthy physical table hold.''',
          )
          design.write_text(design_text)
          PY

          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            prisma/schema.prisma \
            src/components/admin/AdminShell.tsx \
            src/components/admin/tabs/WaitlistTab.tsx \
            src/lib/waitlist/operations.ts \
            tests/security/route-auth-inventory.test.ts \
            tests/security/route-read-inventory.test.ts \
            tests/integration/p0-customer-isolation.ts \
            package.json \
            .github/workflows/p0-integration.yml \
            docs/P1_WAITLIST_OPERATIONS.md
          git commit -m "feat: complete waitlist repository wiring"
          git push origin HEAD:agent/p1-waitlist-operations
