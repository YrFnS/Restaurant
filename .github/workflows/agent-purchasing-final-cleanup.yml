name: Finalize purchasing validation workflow

on:
  pull_request:
    branches:
      - "agent/**"

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.pull_request.head.ref == 'agent/p1-purchase-orders-receiving' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove one-time wiring job and validation trigger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/p1-stacked-validation.yml')
          text = path.read_text()
          start_marker = '  patch-purchasing:\n'
          end_marker = '  validate:\n'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]
              path.write_text(text)
          PY

          rm -f docs/.purchasing-validation-trigger
          git rm .github/workflows/agent-purchasing-final-cleanup.yml
          git add -A
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove purchasing patch scaffolding"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
