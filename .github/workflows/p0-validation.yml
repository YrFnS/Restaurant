name: P0 Validation

on:
  push:
    branches:
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: p0-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: "postgresql://validation:validation@127.0.0.1:5432/restaurant?sslmode=disable"
      AUTH_SECRET: "validation-session-secret-0123456789abcdef0123456789abcdef"
      AUTH_PIN_PEPPER: "validation-pin-pepper-0123456789abcdef0123456789abcdef"
      AUTH_ORDER_ACCESS_SECRET: "validation-order-access-0123456789abcdef0123456789abcdef"
      AUTH_CUSTOMER_ACCESS_SECRET: "validation-customer-access-0123456789abcdef0123456789abcdef"
      NEXTAUTH_SECRET: "validation-nextauth-secret-0123456789abcdef0123456789abcdef"
      NEXTAUTH_URL: "http://localhost:3000"
      KDS_REALTIME_URL: "http://127.0.0.1:3003/broadcast"
      NEXT_PUBLIC_KDS_PORT: "3003"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies and refresh lockfile
        run: bun install

      - name: Commit refreshed lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh Bun lockfile"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        env:
          NODE_ENV: production
        run: bun run build