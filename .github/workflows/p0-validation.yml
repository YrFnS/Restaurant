name: P0 Validation

on:
  push:
    branches:
      - "agent/**"
  pull_request:
    branches:
      - main
      - agent/p0-hardening
      - agent/p1-data-integrity

permissions:
  contents: write

concurrency:
  group: p0-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-loyalty-advisory-lock-fix:
    name: Apply loyalty advisory-lock fix
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/agent/p1-loyalty-gift-cards' && github.event.head_commit.message != 'fix: deserialize loyalty advisory locks safely' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out loyalty branch
        uses: actions/checkout@v4
        with:
          ref: agent/p1-loyalty-gift-cards
          fetch-depth: 0

      - name: Commit the reviewed lock-result correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/loyalty/ledger.ts')
          source = path.read_text()
          old = '''  await client.$queryRaw(Prisma.sql`
    SELECT pg_advisory_xact_lock(
      hashtextextended(${`${namespace}:${key}`}, 0)
    )
  `);'''
          new = '''  await client.$queryRaw<Array<{ locked: string }>>(Prisma.sql`
    SELECT pg_advisory_xact_lock(
      hashtextextended(${`${namespace}:${key}`}, 0)
    )::text AS "locked"
  `);'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one advisory-lock block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

          git show origin/main:.github/workflows/p0-validation.yml > .github/workflows/p0-validation.yml
          rm -f .github/workflows/fix-loyalty-advisory-lock.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/loyalty/ledger.ts \
            .github/workflows/p0-validation.yml \
            .github/workflows/fix-loyalty-advisory-lock.yml
          git commit -m "fix: deserialize loyalty advisory locks safely"
          git push origin HEAD:agent/p1-loyalty-gift-cards

  validate:
    name: Typecheck, tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: "postgresql://validation:validation@127.0.0.1:5432/restaurant?sslmode=disable"
      AUTH_SECRET: "validation-session-secret-0123456789abcdef0123456789abcdef"
      AUTH_PIN_PEPPER: "validation-pin-pepper-0123456789abcdef0123456789abcdef"
      AUTH_ORDER_ACCESS_SECRET: "validation-order-access-0123456789abcdef0123456789abcdef"
      AUTH_CUSTOMER_ACCESS_SECRET: "validation-customer-access-0123456789abcdef0123456789abcdef"
      RATE_LIMIT_SECRET: "validation-rate-limit-secret-0123456789abcdef0123456789abcdef"
      AUTH_SESSION_IDLE_SECONDS: "1800"
      APP_ALLOWED_ORIGINS: ""
      NEXTAUTH_SECRET: "validation-nextauth-secret-0123456789abcdef0123456789abcdef"
      NEXTAUTH_URL: "http://localhost:3000"
      KDS_REALTIME_URL: "http://127.0.0.1:3003/broadcast"
      NEXT_PUBLIC_KDS_PORT: "3003"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Lint
        run: bun run lint

      - name: Production build
        env:
          NODE_ENV: production
        run: bun run build
