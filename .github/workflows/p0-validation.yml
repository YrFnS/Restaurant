name: P0 Validation

on:
  push:
    branches:
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: p0-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: "postgresql://validation:validation@127.0.0.1:5432/restaurant?sslmode=disable"
      AUTH_SECRET: "validation-session-secret-0123456789abcdef0123456789abcdef"
      AUTH_PIN_PEPPER: "validation-pin-pepper-0123456789abcdef0123456789abcdef"
      AUTH_ORDER_ACCESS_SECRET: "validation-order-access-0123456789abcdef0123456789abcdef"
      AUTH_CUSTOMER_ACCESS_SECRET: "validation-customer-access-0123456789abcdef0123456789abcdef"
      APP_ALLOWED_ORIGINS: ""
      NEXTAUTH_SECRET: "validation-nextauth-secret-0123456789abcdef0123456789abcdef"
      NEXTAUTH_URL: "http://localhost:3000"
      KDS_REALTIME_URL: "http://127.0.0.1:3003/broadcast"
      NEXT_PUBLIC_KDS_PORT: "3003"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Lint
        run: bun run lint

      - name: Production build
        env:
          NODE_ENV: production
        run: bun run build