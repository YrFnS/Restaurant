name: Apply immutable timekeeping wiring

on:
  pull_request:
    branches:
      - "agent/**"

permissions:
  contents: write

jobs:
  wire:
    if: ${{ github.event.pull_request.head.ref == 'agent/p1-employee-timekeeping' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed timekeeping integration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/workflows/agent-timekeeping-wiring.yml ]; then
            echo "Timekeeping wiring is already applied."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-timekeeping-wiring.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = []
          for line in workflow[start:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-timekeeping-wiring.py').write_text('\n'.join(script) + '\n')
          PY

          python3 /tmp/apply-timekeeping-wiring.py
          rm -f .github/workflows/agent-timekeeping-wiring.yml
          rm -f .github/workflows/timekeeping-pr-wiring.yml
          rm -f docs/.timekeeping-wiring-trigger

          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiring changes were required."
            exit 0
          fi
          git commit -m "feat: integrate immutable employee timekeeping"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
