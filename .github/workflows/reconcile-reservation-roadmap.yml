name: Reconcile reservation roadmap

on:
  push:
    branches:
      - agent/p1-reservation-availability

permissions:
  contents: write

concurrency:
  group: reconcile-reservation-roadmap
  cancel-in-progress: true

jobs:
  reconcile:
    if: ${{ github.event.head_commit.message != 'docs: reconcile reservation roadmap and validation' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-reservation-availability
          fetch-depth: 0

      - name: Reconcile roadmap and validation record
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconcile-reservation-roadmap.py
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REMEDIATION_PLAN.md docs/P1_RESERVATION_AVAILABILITY.md
          if git diff --cached --quiet; then
            echo "Reservation roadmap is already reconciled."
            exit 0
          fi
          git commit -m "docs: reconcile reservation roadmap and validation"
          git push origin HEAD:agent/p1-reservation-availability
