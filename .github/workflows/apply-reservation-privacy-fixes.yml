name: Apply reservation privacy and overnight fixes

on:
  push:
    branches:
      - agent/p1-reservation-availability

permissions:
  contents: write

concurrency:
  group: reservation-privacy-fixes
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix: tighten reservation privacy and overnight slots' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-reservation-availability
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-reservation-privacy-and-overnight-fixes.py
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/reservations/availability.ts \
            'src/app/api/reservations/[id]/route.ts' \
            tests/integration/p1-reservation-availability.ts \
            tests/security/reservation-availability-source-inventory.test.ts
          if git diff --cached --quiet; then
            echo "Reservation privacy fixes are already applied."
            exit 0
          fi
          git commit -m "fix: tighten reservation privacy and overnight slots"
          git push origin HEAD:agent/p1-reservation-availability
