name: Fix loyalty advisory lock result

on:
  push:
    branches:
      - agent/p1-loyalty-gift-cards
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fix-loyalty-advisory-lock
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/p1-loyalty-gift-cards' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-loyalty-gift-cards
          fetch-depth: 0

      - name: Cast advisory lock result to a Prisma-supported type
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/loyalty/ledger.ts')
          source = path.read_text()
          old = '''  await client.$queryRaw(Prisma.sql`
    SELECT pg_advisory_xact_lock(
      hashtextextended(${`${namespace}:${key}`}, 0)
    )
  `);'''
          new = '''  await client.$queryRaw<Array<{ locked: string }>>(Prisma.sql`
    SELECT pg_advisory_xact_lock(
      hashtextextended(${`${namespace}:${key}`}, 0)
    )::text AS "locked"
  `);'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one advisory-lock block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

          rm .github/workflows/fix-loyalty-advisory-lock.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/loyalty/ledger.ts .github/workflows/fix-loyalty-advisory-lock.yml
          git commit -m "fix: deserialize loyalty advisory locks safely"
          git push origin HEAD:agent/p1-loyalty-gift-cards
