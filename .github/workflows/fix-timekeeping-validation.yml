name: Fix timekeeping validation

on:
  push:
    branches:
      - agent/p1-employee-timekeeping

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix: complete timekeeping validation' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out timekeeping branch
        uses: actions/checkout@v4
        with:
          ref: agent/p1-employee-timekeeping
          fetch-depth: 0

      - name: Apply validation fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected {label} marker was not found in {path}")
              path.write_text(text.replace(old, new, 1))

          settings = Path("src/components/admin/tabs/SettingsTab.tsx")
          replace_once(
              settings,
              '''function SettingsForm({ initial }: { initial: any }) {''',
              '''function minutesToTime(value: unknown): string {
            const parsed = Number(value);
            const minutes = Number.isInteger(parsed)
              ? Math.min(1_439, Math.max(0, parsed))
              : 0;
            return `${String(Math.floor(minutes / 60)).padStart(2, "0")}:${String(
              minutes % 60
            ).padStart(2, "0")}`;
          }

          function timeToMinutes(value: string): number {
            const [hours, minutes] = value.split(":").map(Number);
            if (
              !Number.isInteger(hours) ||
              !Number.isInteger(minutes) ||
              hours < 0 ||
              hours > 23 ||
              minutes < 0 ||
              minutes > 59
            ) {
              return 0;
            }
            return hours * 60 + minutes;
          }

          function SettingsForm({ initial }: { initial: any }) {''',
              "settings time helpers",
          )
          replace_once(
              settings,
              '''              <div className="grid grid-cols-2 gap-3">
                <Field label={isRTL ? "وقت الفتح" : "Open Time"} value={form.openTime} onChange={(v) => set("openTime", v)} dir="ltr" type="time" />
                <Field label={isRTL ? "وقت الإغلاق" : "Close Time"} value={form.closeTime} onChange={(v) => set("closeTime", v)} dir="ltr" type="time" />
              </div>
              <Field label={isRTL ? "متوسط وقت التحضير (دقيقة)" : "Avg Prep Time (min)"} value={String(form.avgPrepTimeMin)} onChange={(v) => set("avgPrepTimeMin", parseInt(v) || 0)} dir="ltr" type="number" />''',
              '''              <div className="grid grid-cols-2 gap-3">
                <Field label={isRTL ? "وقت الفتح" : "Open Time"} value={form.openTime} onChange={(v) => set("openTime", v)} dir="ltr" type="time" />
                <Field label={isRTL ? "وقت الإغلاق" : "Close Time"} value={form.closeTime} onChange={(v) => set("closeTime", v)} dir="ltr" type="time" />
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <Field
                  label={isRTL ? "المنطقة الزمنية" : "Restaurant timezone"}
                  value={form.timezone || "UTC"}
                  onChange={(v) => set("timezone", v)}
                  dir="ltr"
                />
                <Field
                  label={isRTL ? "بداية يوم التشغيل" : "Operational day starts"}
                  value={minutesToTime(form.operationalDayStartMinutes)}
                  onChange={(v) =>
                    set("operationalDayStartMinutes", timeToMinutes(v))
                  }
                  dir="ltr"
                  type="time"
                />
              </div>
              <p className="text-xs text-muted-foreground">
                {isRTL
                  ? "تُستخدم المنطقة الزمنية وبداية يوم التشغيل لربط المناوبات الليلية بالتاريخ التشغيلي الصحيح. استخدم اسماً معتمداً مثل Asia/Baghdad."
                  : "Timezone and operational-day start assign overnight shifts to the correct business date. Use an IANA name such as Asia/Baghdad."}
              </p>
              <Field label={isRTL ? "متوسط وقت التحضير (دقيقة)" : "Avg Prep Time (min)"} value={String(form.avgPrepTimeMin)} onChange={(v) => set("avgPrepTimeMin", parseInt(v) || 0)} dir="ltr" type="number" />''',
              "settings timezone controls",
          )

          lockout = Path("tests/integration/p0-login-lockout.ts")
          replace_once(
              lockout,
              '''        await tx.schedule.deleteMany({
              where: { employeeId: cleanupTargetId },
            });
            await tx.employee.deleteMany({ where: { id: cleanupTargetId } });''',
              '''        await tx.schedule.deleteMany({
              where: { employeeId: cleanupTargetId },
            });
            // The clock-in/out events are an immutable audit ledger. Preserve the
            // employee record they reference and retire the disposable account.
            await tx.employee.updateMany({
              where: { id: cleanupTargetId },
              data: { isActive: false },
            });''',
              "lockout cleanup",
          )

          roadmap = Path("docs/REMEDIATION_PLAN.md")
          replace_once(
              roadmap,
              '> **Tracking branch:** `agent/p1-purchase-orders-receiving`  ',
              '> **Tracking branch:** `agent/p1-employee-timekeeping`  ',
              "tracking branch",
          )
          replace_once(
              roadmap,
              '- [`P1_PURCHASE_ORDERS_RECEIVING.md`](./P1_PURCHASE_ORDERS_RECEIVING.md)\n',
              '- [`P1_PURCHASE_ORDERS_RECEIVING.md`](./P1_PURCHASE_ORDERS_RECEIVING.md)\n- [`P1_EMPLOYEE_TIMEKEEPING.md`](./P1_EMPLOYEE_TIMEKEEPING.md)\n',
              "timekeeping document link",
          )
          replace_once(
              roadmap,
              '| P1-B01 | Cash-register sessions and reconciliation | Completed and validated |\n',
              '| P1-B01 | Cash-register sessions and reconciliation | Completed and validated |\n| P1-B02 | Immutable employee timekeeping | In progress on `agent/p1-employee-timekeeping` |\n',
              "timekeeping milestone row",
          )
          replace_once(
              roadmap,
              '                    └── agent/p1-purchase-orders-receiving\n',
              '                    └── agent/p1-purchase-orders-receiving\n                        └── agent/p1-employee-timekeeping\n',
              "branch stack",
          )
          replace_once(
              roadmap,
              '''## P1-B02 Employee timekeeping

          - [ ] Add immutable clock, break, and shift entries.
          - [ ] Support audited manager corrections instead of rewriting historical state.
          - [ ] Calculate hours from events.
          - [ ] Define overnight-shift and restaurant-timezone behavior.''',
              '''## P1-B02 Employee timekeeping

          Current implementation target: `agent/p1-employee-timekeeping`

          - [ ] Add immutable clock-in, clock-out, break-start, and break-end events.
          - [ ] Enforce one open shift and one open break per employee with row locks.
          - [ ] Store immutable closed-shift summaries and exact wage/labor-cost snapshots.
          - [ ] Support audited append-only manager corrections instead of rewriting history.
          - [ ] Calculate gross, break, paid time, and adjusted labor cost from the ledger.
          - [ ] Add configurable restaurant timezone and operational-day boundary for overnight shifts.
          - [ ] Add protected kiosk and manager APIs, bilingual timesheet workflow, and database-backed tests.''',
              "timekeeping roadmap section",
          )

          PY

          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/admin/tabs/SettingsTab.tsx \
            tests/integration/p0-login-lockout.ts \
            docs/REMEDIATION_PLAN.md
          git commit -m "fix: complete timekeeping validation"
          git push origin HEAD:agent/p1-employee-timekeeping
