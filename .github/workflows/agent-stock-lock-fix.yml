name: Agent stock advisory-lock fix

on:
  push:
    branches:
      - agent/p1-stock-ledger-recipes

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix: deserialize stock advisory locks safely' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-stock-ledger-recipes
          fetch-depth: 0

      - name: Patch advisory lock query
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/inventory/stock-ledger.ts')
          text = path.read_text()
          old = '''  await client.$queryRaw(Prisma.sql`\n    SELECT pg_advisory_xact_lock(\n      hashtextextended(${`${namespace}:${key}`}, 0)\n    )\n  `);'''
          new = '''  await client.$queryRaw<Array<{ locked: string }>>(Prisma.sql`\n    SELECT pg_advisory_xact_lock(\n      hashtextextended(${`${namespace}:${key}`}, 0)\n    )::text AS "locked"\n  `);'''
          if old not in text:
              raise SystemExit('Expected advisory-lock query was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-off workflow and commit
        run: |
          git rm .github/workflows/agent-stock-lock-fix.yml
          git add src/lib/inventory/stock-ledger.ts
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: deserialize stock advisory locks safely"
          git push origin HEAD:agent/p1-stock-ledger-recipes
