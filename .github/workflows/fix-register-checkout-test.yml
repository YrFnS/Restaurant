name: Apply checkout contract test fixes

on:
  push:
    branches:
      - agent/p1-loyalty-gift-cards

permissions:
  contents: write

concurrency:
  group: fix-checkout-contract-tests
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'test: add checkout idempotency to register and reversal suites' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out loyalty branch
        uses: actions/checkout@v4
        with:
          ref: agent/p1-loyalty-gift-cards
          fetch-depth: 0

      - name: Update stale checkout requests and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path('tests/integration/p1-cash-register-sessions.ts'),
                  '''        method: "POST",
        headers: { cookie: serverCookie },
        body: JSON.stringify({
          orderId: order.id,
          paymentMethod: "cash",
          tendered: order.total,
        }),''',
                  '''        method: "POST",
        headers: {
          cookie: serverCookie,
          "idempotency-key": `p1-register-checkout-${crypto.randomUUID()}`,
        },
        body: JSON.stringify({
          orderId: order.id,
          paymentMethod: "cash",
          tendered: order.total,
        }),''',
                  'register checkout request',
              ),
              (
                  Path('tests/integration/p1-payment-reversals.ts'),
                  '''      method: "POST",
      headers: { cookie },
      body: JSON.stringify({
        orderId: order.id,
        paymentMethod: "cash",
        tendered: order.total,
      }),''',
                  '''      method: "POST",
      headers: {
        cookie,
        "idempotency-key": `p1-reversal-checkout-${crypto.randomUUID()}`,
      },
      body: JSON.stringify({
        orderId: order.id,
        paymentMethod: "cash",
        tendered: order.total,
      }),''',
                  'payment-reversal checkout request',
              ),
          ]

          for path, old, new, label in replacements:
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label}, found {count}')
              path.write_text(source.replace(old, new, 1))
          PY

          rm .github/workflows/fix-register-checkout-test.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/integration/p1-cash-register-sessions.ts \
            tests/integration/p1-payment-reversals.ts \
            .github/workflows/fix-register-checkout-test.yml
          git commit -m "test: add checkout idempotency to register and reversal suites"
          git push origin HEAD:agent/p1-loyalty-gift-cards
