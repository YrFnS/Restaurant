name: Materialize KDS Outbox Schema Once

on:
  push:
    branches:
      - agent/p0-hardening

permissions:
  contents: write

concurrency:
  group: materialize-kds-outbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Materialize committed Prisma model
        run: python3 scripts/materialize-kds-outbox.py

      - name: Commit generated schema when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- prisma/schema.prisma; then
            echo "KDS outbox model is already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "fix: materialize KDS outbox Prisma model"
          git push origin HEAD:${GITHUB_REF_NAME}
