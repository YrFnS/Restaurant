name: Apply reservation type fixes

on:
  push:
    branches:
      - agent/p1-reservation-availability

permissions:
  contents: write

concurrency:
  group: reservation-type-fixes
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix: align reservation types and replay tests' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-reservation-availability
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-reservation-type-fixes.py
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/reservations/availability.ts \
            src/app/api/reservation-settings/route.ts \
            'src/app/api/reservations/[id]/route.ts' \
            tests/integration/p1-reservation-availability.ts
          if git diff --cached --quiet; then
            echo "Reservation type fixes are already applied."
            exit 0
          fi
          git commit -m "fix: align reservation types and replay tests"
          git push origin HEAD:agent/p1-reservation-availability
