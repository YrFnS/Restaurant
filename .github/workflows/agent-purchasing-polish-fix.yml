name: Apply purchasing policy and lint fix

on:
  pull_request:
    branches:
      - "agent/**"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'agent/p1-purchase-orders-receiving' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Align permanent policy marker and remove unused UI symbols
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          design = Path('docs/P1_PURCHASE_ORDERS_RECEIVING.md')
          text = design.read_text()
          old = '''Purchase-receipt stock movements cannot be reversed through the generic stock-ledger endpoint. A manager or inventory manager must use the purchasing correction workflow so the system can atomically:'''
          new = '''Generic stock reversal is deliberately rejected for purchase-receipt movements. A manager or inventory manager must use the purchasing correction workflow so the system can atomically:'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected receipt-correction policy marker was not found')
              design.write_text(text.replace(old, new, 1))

          ui = Path('src/components/admin/tabs/PurchasingTab.tsx')
          text = ui.read_text()
          for marker in ['  Boxes,\n', '  CalendarClock,\n', '  CheckCircle2,\n']:
              text = text.replace(marker, '')
          text = text.replace(
              '''          fmtCurrency={fmtCurrency}\n          fmtNumber={fmtNumber}\n          busyId={busyId}''',
              '''          fmtCurrency={fmtCurrency}\n          busyId={busyId}''',
              1,
          )
          text = text.replace(
              '''  fmtCurrency,\n  fmtNumber,\n  busyId,''',
              '''  fmtCurrency,\n  busyId,''',
              1,
          )
          text = text.replace(
              '''  fmtCurrency: (value: number) => string;\n  fmtNumber: (value: number) => string;\n  busyId: string | null;''',
              '''  fmtCurrency: (value: number) => string;\n  busyId: string | null;''',
              1,
          )
          ui.write_text(text)
          PY

          git rm .github/workflows/agent-purchasing-polish-fix.yml
          git add docs/P1_PURCHASE_ORDERS_RECEIVING.md src/components/admin/tabs/PurchasingTab.tsx
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align purchasing policy and lint"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
