name: Fix waitlist expiry fixture once

on:
  push:
    branches:
      - agent/p1-waitlist-capacity

permissions:
  contents: write

concurrency:
  group: fix-waitlist-expiry-fixture-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-waitlist-capacity
          fetch-depth: 0

      - name: Preserve the notification range while simulating expiry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/integration/p1-waitlist-operations.ts")
          text = path.read_text()
          old = "    data: { notificationExpiresAt: addMinutes(new Date(), -1) },"
          new = """    data: {
              notifiedAt: addMinutes(new Date(), -2),
              notificationExpiresAt: addMinutes(new Date(), -1),
            },"""
          if text.count(old) != 1:
              raise SystemExit(f"Expected one expiry assignment, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/fix-waitlist-expiry-fixture-once.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/p1-waitlist-operations.ts .github/workflows/fix-waitlist-expiry-fixture-once.yml
          git commit -m "test: keep expired waitlist notification valid"
          git push origin HEAD:agent/p1-waitlist-capacity
