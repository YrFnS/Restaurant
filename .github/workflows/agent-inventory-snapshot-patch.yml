              '''  supplier          String?\n  category          String?\n  createdAt         DateTime @default(now())''',
              '''  supplier          String?\n  category          String?\n  unitConversions   IngredientUnitConversion[]\n  recipeComponents  RecipeComponent[]\n  stockMovements    StockMovement[]\n  createdAt         DateTime @default(now())''',
              "ingredient stock relations",
          )
          if "model IngredientUnitConversion" not in schema:
              models = r'''
model IngredientUnitConversion {
  id           String     @id
  ingredientId String
  ingredient   Ingredient @relation(fields: [ingredientId], references: [id], onDelete: Restrict)
  unit         String
  toBaseMicros BigInt
  createdAt    DateTime   @default(now())
  updatedAt    DateTime   @updatedAt

  @@unique([ingredientId, unit], map: "IngredientUnitConversion_ingredient_unit_key")
  @@index([ingredientId, createdAt], map: "IngredientUnitConversion_ingredient_idx")
}

model Recipe {
  id                 String            @id
  creationKey        String            @unique(map: "Recipe_creationKey_key")
  menuItemId         String
  menuItem           MenuItem          @relation(fields: [menuItemId], references: [id], onDelete: Restrict)
  version            Int
  yieldMicros        BigInt            @default(1000000)
  isActive           Boolean           @default(true)
  createdById        String?
  createdByName      String            @default("")
  createdAt          DateTime          @default(now())
  supersededAt       DateTime?
  components         RecipeComponent[]
  consumedOrderItems OrderItem[]       @relation("OrderItemInventoryRecipe")

  @@unique([menuItemId, version], map: "Recipe_menuItem_version_key")
  @@index([menuItemId, createdAt(sort: Desc)], map: "Recipe_menuItem_createdAt_idx")
}

model RecipeComponent {
  id               String          @id
  recipeId         String
  recipe           Recipe          @relation(fields: [recipeId], references: [id], onDelete: Restrict)
  ingredientId     String
  ingredient       Ingredient      @relation(fields: [ingredientId], references: [id], onDelete: Restrict)
  modifierOptionId String?
  modifierOption   ModifierOption? @relation(fields: [modifierOptionId], references: [id], onDelete: Restrict)
  quantityMicros   BigInt
  createdAt        DateTime        @default(now())

  @@index([recipeId, createdAt], map: "RecipeComponent_recipe_idx")
  @@index([ingredientId, createdAt], map: "RecipeComponent_ingredient_idx")
  @@index([modifierOptionId], map: "RecipeComponent_modifier_idx")
}

model StockMovement {
  id                  String            @id
  idempotencyKey      String            @unique(map: "StockMovement_idempotencyKey_key")
