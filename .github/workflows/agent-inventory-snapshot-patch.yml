          integration = integration[:block_start] + order_block + integration[block_end:]
          path.write_text(integration)

          # Document the one-way snapshot policy.
          path = Path("docs/P1_STOCK_LEDGER_RECIPES.md")
          docs = path.read_text()
          docs = replace_once(
              docs,
              '''- deterministic movement keys make retries and repeated status calls safe;\n- an item without an active recipe remains operational but is reported as untracked during rollout;''',
              '''- the first production transition stores an immutable recipe ID/version snapshot on the order item;\n- deterministic movement keys make retries and repeated status calls safe;\n- publishing a newer recipe cannot consume the same order item again;\n- an item without an active recipe is permanently marked untracked for that production lifecycle, so publishing a recipe later cannot retroactively deduct it;''',
              "production snapshot policy",
          )
          docs = replace_once(
              docs,
              '''13. Recipe modifier components must belong to the same menu item.\n''',
              '''13. Recipe modifier components must belong to the same menu item.\n14. Each order item moves one way from pending inventory evaluation to either consumed or untracked.\n15. Consumed recipe ID/version snapshots cannot be edited after production begins.\n''',
              "snapshot database guarantees",
          )
          path.write_text(docs)
          PY

      - name: Remove patch workflow and trigger marker
        run: |
          rm -f .github/workflows/agent-inventory-snapshot-patch.yml
          rm -f docs/.inventory-snapshot-trigger

      - name: Commit snapshot architecture
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enforce one-time inventory consumption snapshots"
          git push origin HEAD:agent/p1-stock-ledger-recipes
