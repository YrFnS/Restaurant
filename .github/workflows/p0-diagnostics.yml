name: P0 Diagnostics

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: p0-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Publish validation diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: production
      DATABASE_URL: "postgresql://validation:validation@127.0.0.1:5432/restaurant?sslmode=disable"
      AUTH_SECRET: "validation-session-secret-0123456789abcdef0123456789abcdef"
      AUTH_PIN_PEPPER: "validation-pin-pepper-0123456789abcdef0123456789abcdef"
      AUTH_ORDER_ACCESS_SECRET: "validation-order-access-0123456789abcdef0123456789abcdef"
      AUTH_CUSTOMER_ACCESS_SECRET: "validation-customer-access-0123456789abcdef0123456789abcdef"
      NEXTAUTH_SECRET: "validation-nextauth-secret-0123456789abcdef0123456789abcdef"
      NEXTAUTH_URL: "http://localhost:3000"
      KDS_REALTIME_URL: "http://127.0.0.1:3003/broadcast"
      NEXT_PUBLIC_KDS_PORT: "3003"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun install --frozen-lockfile 2>&1 | tee /tmp/p0-install.log

      - name: Generate Prisma client
        id: generate
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run db:generate 2>&1 | tee /tmp/p0-generate.log

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success' && steps.generate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee /tmp/p0-typecheck.log

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success' && steps.generate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee /tmp/p0-lint.log

      - name: Production build
        id: build
        if: steps.install.outcome == 'success' && steps.generate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee /tmp/p0-build.log

      - name: Publish statuses and failure details
        if: always()
        uses: actions/github-script@v9
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const fs = require('fs');
            const stages = {
              install: process.env.INSTALL_OUTCOME || 'skipped',
              generate: process.env.GENERATE_OUTCOME || 'skipped',
              typecheck: process.env.TYPECHECK_OUTCOME || 'skipped',
              lint: process.env.LINT_OUTCOME || 'skipped',
              build: process.env.BUILD_OUTCOME || 'skipped',
            };

            for (const [name, outcome] of Object.entries(stages)) {
              const success = outcome === 'success';
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: success ? 'success' : 'failure',
                context: `p0/${name}`,
                description: success
                  ? `${name} passed`
                  : `${name} ${outcome}`.slice(0, 140),
              });
            }

            const failed = Object.entries(stages).filter(([, outcome]) => outcome !== 'success');
            if (failed.length === 0) return;

            let body = `## P0 validation diagnostics\n\nCommit: \`${context.sha}\`\n\n`;
            body += Object.entries(stages)
              .map(([name, outcome]) => `- **${name}:** ${outcome}`)
              .join('\n');

            for (const [name] of failed) {
              const path = `/tmp/p0-${name}.log`;
              if (!fs.existsSync(path)) continue;
              const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/);
              const tail = lines.slice(-120).join('\n').slice(-12000);
              body += `\n\n### ${name} failure tail\n\n\`\`\`text\n${tail}\n\`\`\``;
            }

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body.slice(0, 60000),
            });

      - name: Fail when validation is not green
        if: >-
          always() &&
          (steps.install.outcome != 'success' ||
           steps.generate.outcome != 'success' ||
           steps.typecheck.outcome != 'success' ||
           steps.lint.outcome != 'success' ||
           steps.build.outcome != 'success')
        run: exit 1
