name: Materialize Payment Ledger Once

on:
  push:
    branches:
      - agent/p0-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: payment-ledger-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize payment ledger schema
        run: python3 scripts/materialize-payment-ledger.py

      - name: Commit source changes when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- prisma/schema.prisma prisma/seed.ts; then
            echo "Payment ledger schema is already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma prisma/seed.ts
          git commit -m "db: materialize immutable payment event model"

          branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
