name: Agent purchasing integration patch

on:
  push:
    branches:
      - agent/p1-purchase-orders-receiving

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'feat: integrate exact purchasing workflow' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-purchase-orders-receiving
          fetch-depth: 0

      - name: Apply reviewed purchasing integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"Expected {label} marker was not found")
              return text.replace(old, new, 1)

          # First-class Prisma mappings.
          path = Path('prisma/schema.prisma')
          schema = path.read_text()
          schema = replace_once(
              schema,
              '''enum InventoryConsumptionState {\n  pending\n  consumed\n  untracked\n}\n''',
              '''enum InventoryConsumptionState {\n  pending\n  consumed\n  untracked\n}\n\nenum SupplierStatus {\n  active\n  inactive\n}\n\nenum PurchaseOrderStatus {\n  draft\n  submitted\n  partially_received\n  received\n  cancelled\n}\n\nenum PurchaseReceiptStatus {\n  posted\n  reversed\n}\n''',
              'purchasing enums',
          )
          schema = replace_once(
              schema,
              '''  stockMovements    StockMovement[]\n  createdAt         DateTime @default(now())''',
              '''  stockMovements       StockMovement[]\n  purchaseOrderLines   PurchaseOrderLine[]\n  purchaseReceiptLines PurchaseReceiptLine[]\n  createdAt            DateTime @default(now())''',
              'ingredient purchasing relations',
          )
          schema = replace_once(
              schema,
              '''  occurredAt          DateTime          @default(now())\n  createdAt           DateTime          @default(now())\n\n  @@index([ingredientId, createdAt(sort: Desc)], map: "StockMovement_ingredient_createdAt_idx")''',
              '''  occurredAt                  DateTime              @default(now())\n  createdAt                   DateTime              @default(now())\n  purchaseReceiptLines        PurchaseReceiptLine[] @relation("PurchaseReceiptStockMovement")\n  purchaseReceiptReversalLines PurchaseReceiptLine[] @relation("PurchaseReceiptReversalMovement")\n\n  @@index([ingredientId, createdAt(sort: Desc)], map: "StockMovement_ingredient_createdAt_idx")''',
              'stock movement receipt relations',
          )

          legacy = '''model PurchaseOrder {\n  id             String   @id @default(cuid())\n  supplier       String\n  notes          String?\n  status         String   @default("draft")\n  totalCost      Float    @default(0)\n  totalCostMinor BigInt   @default(0)\n  createdAt      DateTime @default(now())\n  updatedAt      DateTime @default(now()) @updatedAt\n}\n'''
          purchasing_models = '''model Supplier {\n  id             String         @id\n  code           String         @unique(map: "Supplier_code_key")\n  name           String\n  contactName    String         @default("")\n  phone          String         @default("")\n  email          String         @default("")\n  address        String         @default("")\n  paymentTerms   String         @default("")\n  notes          String?\n  status         SupplierStatus @default(active)\n  purchaseOrders PurchaseOrder[]\n  createdAt      DateTime       @default(now())\n  updatedAt      DateTime       @updatedAt\n\n  @@index([status, name], map: "Supplier_status_name_idx")\n}\n\nmodel PurchaseOrder {\n  id                 String              @id @default(cuid())\n  orderNumber        String              @unique(map: "PurchaseOrder_orderNumber_key")\n  creationKey        String              @unique(map: "PurchaseOrder_creationKey_key")\n  supplierId         String\n  supplierRecord     Supplier            @relation(fields: [supplierId], references: [id], onDelete: Restrict)\n  supplierCode       String              @default("")\n  supplier           String\n  currency           String              @default("USD")\n  notes              String?\n  status             PurchaseOrderStatus @default(draft)\n  totalCost          Float               @default(0)\n  totalCostMinor     BigInt              @default(0)\n  expectedAt         DateTime?\n  createdById        String?\n  createdByName      String              @default("")\n  submittedById      String?\n  submittedByName    String?\n  submittedAt        DateTime?\n  cancelledById      String?\n  cancelledByName    String?\n  cancelledAt        DateTime?\n  cancellationReason String?\n  legacyImported     Boolean             @default(false)\n  lines              PurchaseOrderLine[]\n  receipts           PurchaseReceipt[]\n  createdAt          DateTime            @default(now())\n  updatedAt          DateTime            @updatedAt\n\n  @@index([supplierId, status, createdAt(sort: Desc)], map: "PurchaseOrder_supplier_status_createdAt_idx")\n  @@index([status, expectedAt], map: "PurchaseOrder_status_expectedAt_idx")\n}\n\nmodel PurchaseOrderLine {\n  id                            String                @id\n  purchaseOrderId               String\n  purchaseOrder                 PurchaseOrder         @relation(fields: [purchaseOrderId], references: [id], onDelete: Restrict)\n  lineNumber                    Int\n  ingredientId                  String\n  ingredient                    Ingredient            @relation(fields: [ingredientId], references: [id], onDelete: Restrict)\n  ingredientName                String\n  baseUnit                      String\n  purchaseUnit                  String\n  conversionToBaseMicros        BigInt\n  orderedPurchaseQuantityMicros BigInt\n  orderedBaseQuantityMicros     BigInt\n  receivedBaseQuantityMicros    BigInt                @default(0)\n  purchaseUnitCostMicros        BigInt\n  baseUnitCostMicros            BigInt\n  lineTotalMinor                BigInt\n  notes                          String?\n  receiptLines                   PurchaseReceiptLine[]\n  createdAt                      DateTime              @default(now())\n  updatedAt                      DateTime              @updatedAt\n\n  @@unique([purchaseOrderId, lineNumber], map: "PurchaseOrderLine_order_lineNumber_key")\n  @@index([ingredientId, createdAt(sort: Desc)], map: "PurchaseOrderLine_ingredient_createdAt_idx")\n  @@index([purchaseOrderId, receivedBaseQuantityMicros], map: "PurchaseOrderLine_order_received_idx")\n}\n\nmodel PurchaseReceipt {\n  id               String                @id\n  receiptNumber    String                @unique(map: "PurchaseReceipt_receiptNumber_key")\n  idempotencyKey   String                @unique(map: "PurchaseReceipt_idempotencyKey_key")\n  reversalKey      String?\n  purchaseOrderId  String\n  purchaseOrder    PurchaseOrder         @relation(fields: [purchaseOrderId], references: [id], onDelete: Restrict)\n  status           PurchaseReceiptStatus @default(posted)\n  totalCostMinor   BigInt                @default(0)\n  notes            String?\n  receivedById     String\n  receivedByName   String\n  occurredAt       DateTime              @default(now())\n  reversedById     String?\n  reversedByName   String?\n  reversedAt       DateTime?\n  reversalReason   String?\n  lines            PurchaseReceiptLine[]\n  createdAt        DateTime              @default(now())\n\n  @@index([purchaseOrderId, createdAt(sort: Desc)], map: "PurchaseReceipt_order_createdAt_idx")\n  @@index([status, createdAt(sort: Desc)], map: "PurchaseReceipt_status_createdAt_idx")\n}\n\nmodel PurchaseReceiptLine {\n  id                         String             @id\n  receiptId                  String\n  receipt                    PurchaseReceipt    @relation(fields: [receiptId], references: [id], onDelete: Restrict)\n  purchaseOrderLineId        String\n  purchaseOrderLine          PurchaseOrderLine  @relation(fields: [purchaseOrderLineId], references: [id], onDelete: Restrict)\n  ingredientId               String\n  ingredient                 Ingredient         @relation(fields: [ingredientId], references: [id], onDelete: Restrict)\n  ingredientName             String\n  submittedUnit              String\n  submittedQuantityMicros    BigInt\n  conversionToBaseMicros     BigInt\n  baseQuantityMicros         BigInt\n  purchaseUnitCostMicros     BigInt\n  baseUnitCostMicros         BigInt\n  totalCostMinor             BigInt\n  stockMovementId            String             @unique(map: "PurchaseReceiptLine_stockMovement_key")\n  stockMovement              StockMovement      @relation("PurchaseReceiptStockMovement", fields: [stockMovementId], references: [id], onDelete: Restrict)\n  reversalMovementId         String?\n  reversalMovement           StockMovement?     @relation("PurchaseReceiptReversalMovement", fields: [reversalMovementId], references: [id], onDelete: Restrict)\n  createdAt                  DateTime           @default(now())\n\n  @@unique([receiptId, purchaseOrderLineId], map: "PurchaseReceiptLine_receipt_orderLine_key")\n  @@index([purchaseOrderLineId, createdAt(sort: Desc)], map: "PurchaseReceiptLine_orderLine_createdAt_idx")\n  @@index([ingredientId, createdAt(sort: Desc)], map: "PurchaseReceiptLine_ingredient_createdAt_idx")\n}\n'''
          schema = replace_once(schema, legacy, purchasing_models, 'purchase order models')
          path.write_text(schema)

          # BigInt JSON governance.
          path = Path('src/lib/db.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '  purchaseOrder: { totalCostMinor: true },',
              '''  purchaseOrder: { totalCostMinor: true },\n  purchaseOrderLine: {\n    conversionToBaseMicros: true,\n    orderedPurchaseQuantityMicros: true,\n    orderedBaseQuantityMicros: true,\n    receivedBaseQuantityMicros: true,\n    purchaseUnitCostMicros: true,\n    baseUnitCostMicros: true,\n    lineTotalMinor: true,\n  },\n  purchaseReceipt: { totalCostMinor: true },\n  purchaseReceiptLine: {\n    submittedQuantityMicros: true,\n    conversionToBaseMicros: true,\n    baseQuantityMicros: true,\n    purchaseUnitCostMicros: true,\n    baseUnitCostMicros: true,\n    totalCostMinor: true,\n  },''',
              'purchasing omit policy',
          )
          path.write_text(text)

          # Integration command.
          path = Path('package.json')
          text = path.read_text()
          text = replace_once(
              text,
              'bun tests/integration/p1-stock-ledger-recipes.ts",',
              'bun tests/integration/p1-stock-ledger-recipes.ts && bun tests/integration/p1-purchase-orders-receiving.ts",',
              'purchasing integration command',
          )
          path.write_text(text)

          # Register the bilingual purchasing tab.
          path = Path('src/components/admin/AdminShell.tsx')
          text = path.read_text()
          text = replace_once(text, '  Package,\n  CalendarDays,', '  Package,\n  Truck,\n  CalendarDays,', 'purchasing icon')
          text = replace_once(
              text,
              'import { InventoryTab } from "./tabs/InventoryTab";\n',
              'import { InventoryTab } from "./tabs/InventoryTab";\nimport { PurchasingTab } from "./tabs/PurchasingTab";\n',
              'purchasing tab import',
          )
          text = replace_once(text, '  | "inventory"\n  | "reports"', '  | "inventory"\n  | "purchasing"\n  | "reports"', 'purchasing tab type')
          text = replace_once(text, '  inventory: InventoryTab,\n  reports: ReportsTab,', '  inventory: InventoryTab,\n  purchasing: PurchasingTab,\n  reports: ReportsTab,', 'purchasing tab component')
          text = replace_once(
              text,
              '''      {\n        id: "inventory",\n        label: t.admin.inventory,\n        icon: <Boxes className="size-[18px]" />,\n        roles: INVENTORY_MANAGEMENT_ROLES,\n      },\n      {\n        id: "reports",''',
              '''      {\n        id: "inventory",\n        label: t.admin.inventory,\n        icon: <Boxes className="size-[18px]" />,\n        roles: INVENTORY_MANAGEMENT_ROLES,\n      },\n      {\n        id: "purchasing",\n        label: isRTL ? "الموردون وأوامر الشراء" : "Purchasing & Receiving",\n        icon: <Truck className="size-[18px]" />,\n        roles: INVENTORY_MANAGEMENT_ROLES,\n      },\n      {\n        id: "reports",''',
              'purchasing navigation item',
          )
          path.write_text(text)

          # Domain-enum coverage.
          path = Path('tests/integration/p1-domain-integrity.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '  PaymentStatus,\n  PrismaClient,',
              '  PaymentStatus,\n  PurchaseOrderStatus,\n  PurchaseReceiptStatus,\n  PrismaClient,',
              'purchase enum imports',
          )
          text = replace_once(
              text,
              '  StaffRole,\n  TableShape,',
              '  StaffRole,\n  SupplierStatus,\n  TableShape,',
              'supplier enum import',
          )
          text = replace_once(
              text,
              '  PaymentEventStatus: ["pending", "succeeded", "failed", "voided"],\n};',
              '''  PaymentEventStatus: ["pending", "succeeded", "failed", "voided"],\n  SupplierStatus: ["active", "inactive"],\n  PurchaseOrderStatus: [\n    "draft",\n    "submitted",\n    "partially_received",\n    "received",\n    "cancelled",\n  ],\n  PurchaseReceiptStatus: ["posted", "reversed"],\n};''',
              'purchase enum catalog',
          )
          text = replace_once(
              text,
              '  assert.equal(PaymentEventStatus.failed, "failed");\n}',
              '''  assert.equal(PaymentEventStatus.failed, "failed");\n  assert.equal(SupplierStatus.active, "active");\n  assert.equal(PurchaseOrderStatus.partially_received, "partially_received");\n  assert.equal(PurchaseReceiptStatus.reversed, "reversed");\n}''',
              'purchase enum round trips',
          )
          path.write_text(text)

          # Exact-write inventory: purchasing is no longer deferred.
          path = Path('tests/security/exact-money-write-inventory.test.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '''  {\n    file: "src/app/api/inventory/route.ts",\n    compatibilityFields: ["costPerUnit"],\n    exactMarkers: ["costPerUnitMicros", "unitCostMicros"],\n  },''',
              '''  {\n    file: "src/app/api/inventory/route.ts",\n    compatibilityFields: ["costPerUnit"],\n    exactMarkers: ["costPerUnitMicros", "unitCostMicros"],\n  },\n  {\n    file: "src/lib/inventory/purchasing.ts",\n    compatibilityFields: ["totalCost"],\n    exactMarkers: [\n      "totalCostMinor",\n      "lineTotalMinor",\n      "purchaseUnitCostMicros",\n      "baseUnitCostMicros",\n    ],\n  },''',
              'purchasing exact-write policy',
          )
          text = text.replace('  PurchaseOrder: ["totalCost"],\n', '')
          path.write_text(text)

          # Generic stock reversals must not bypass receipt correction.
          path = Path('src/lib/inventory/stock-ledger-impl.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '''  if (original.movementType === "reversal") {\n    throw new InventoryLedgerError(''',
              '''  if (original.sourceType === "PurchaseReceipt") {\n    throw new InventoryLedgerError(\n      "Purchase receipt stock must be corrected from Purchasing",\n      "PURCHASE_RECEIPT_REVERSAL_REQUIRED",\n      409\n    );\n  }\n  if (original.movementType === "reversal") {\n    throw new InventoryLedgerError(''',
              'purchase receipt reversal guard',
          )
          path.write_text(text)

          # Correct receipt audit property and inventory marker typo.
          path = Path('src/app/api/purchase-orders/[id]/receipts/route.ts')
          text = path.read_text().replace('posted.purchaseOrder.id', 'posted.order.id').replace('posted.purchaseOrder.orderNumber', 'posted.order.orderNumber')
          path.write_text(text)

          path = Path('tests/security/purchase-order-source-inventory.test.ts')
          text = path.read_text().replace('PurchaseOrderLine_order_line_key', 'PurchaseOrderLine_order_lineNumber_key')
          path.write_text(text)

          # Roadmap and exact-money status reconciliation.
          path = Path('docs/REMEDIATION_PLAN.md')
          text = path.read_text()
          text = text.replace('> **Tracking branch:** `agent/p1-stock-ledger-recipes`', '> **Tracking branch:** `agent/p1-purchase-orders-receiving`')
          text = text.replace('| P1-B03 | Recipes and immutable stock ledger | Completed and validated |', '| P1-B03 | Recipes and immutable stock ledger | Completed and validated |\n| P1-B04 | Suppliers, purchase orders, and partial receiving | In progress on `agent/p1-purchase-orders-receiving` |')
          text = text.replace('                └── agent/p1-stock-ledger-recipes\n', '                └── agent/p1-stock-ledger-recipes\n                    └── agent/p1-purchase-orders-receiving\n')
          text = text.replace('## P1-B04 Purchase orders\n\n- [ ] Add lines, supplier records, terms, and exact cost snapshots.\n- [ ] Add draft, submitted, partially received, received, and cancelled workflow.\n- [ ] Support partial receiving through stock-receipt movements.\n- [ ] Preserve price and quantity history.', '''## P1-B04 Purchase orders\n\nCurrent implementation target on `agent/p1-purchase-orders-receiving`:\n\n- [ ] Add first-class supplier records and lifecycle controls.\n- [ ] Add exact purchase-order lines, purchasing units, conversions, and commercial snapshots.\n- [ ] Add draft, submitted, partially received, received, and cancelled workflow.\n- [ ] Freeze submitted commercial terms and preserve historical quantity/cost snapshots.\n- [ ] Support partial receiving through immutable stock-receipt movements.\n- [ ] Add idempotent receipt corrections instead of editing or deleting history.\n- [ ] Add bilingual purchasing operations, source inventories, and database-backed tests.\n\nPolicy: receipt costs are immutable historical snapshots. Weighted-average, FIFO, lot valuation, vendor returns, and automatic repricing remain separate reviewed decisions.''')
          text = text.replace('| 2026-07-31 | Added exact inventory balances, unit conversions, immutable stock movements, versioned recipes, production consumption snapshots, bilingual operator workflow, and full regression coverage. | P1 Stacked Validation #32 green at `8e66dfd`. |', '| 2026-07-31 | Added exact inventory balances, unit conversions, immutable stock movements, versioned recipes, production consumption snapshots, bilingual operator workflow, and full regression coverage. | P1 Stacked Validation #32 green at `8e66dfd`. |\n| 2026-07-31 | Started first-class suppliers, exact purchase orders, partial receiving, and receipt corrections. | `agent/p1-purchase-orders-receiving`. |')
          path.write_text(text)

          path = Path('docs/P1_IMPLEMENTATION_STATUS.md')
          text = path.read_text()
          text = text.replace('gift-card, purchase-order, combo-meal, customer-spend, special-offer, promo-code', 'gift-card, combo-meal, customer-spend, special-offer, promo-code')
          text += '\n\n## Follow-on workflow resolution\n\n- Purchase-order exact totals, line costs, quantities, and receiving snapshots are implemented in the stacked `agent/p1-purchase-orders-receiving` slice. They are no longer compatibility-only.\n'
          path.write_text(text)
          PY

          rm -f .github/workflows/agent-purchasing-integration-patch.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate exact purchasing workflow"
          git push origin HEAD:agent/p1-purchase-orders-receiving
