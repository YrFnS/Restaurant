name: Finalize purchasing roadmap

on:
  pull_request:
    branches:
      - "agent/**"

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.pull_request.head.ref == 'agent/p1-purchase-orders-receiving' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconcile completed purchasing scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"Expected {label} marker was not found")
              return text.replace(old, new, 1)

          path = Path('docs/REMEDIATION_PLAN.md')
          text = path.read_text()
          text = replace_once(
              text,
              '> **Current milestone:** P1 restaurant workflow correctness — timekeeping, purchasing, reservations, and loyalty',
              '> **Current milestone:** P1 restaurant workflow correctness — timekeeping, reservations, waitlist, and loyalty',
              'current milestone',
          )
          text = replace_once(
              text,
              '| P1-B04 | Suppliers, purchase orders, and partial receiving | In progress on `agent/p1-purchase-orders-receiving` |',
              '| P1-B04 | Suppliers, purchase orders, and partial receiving | Completed and validated |',
              'purchasing milestone status',
          )
          text = replace_once(
              text,
              '| P1 recipes and immutable stock ledger | `8e66dfd9e12c9f2eb95798c9bd10ada9332c533d` | P1 Stacked Validation #32 |',
              '| P1 recipes and immutable stock ledger | `8e66dfd9e12c9f2eb95798c9bd10ada9332c533d` | P1 Stacked Validation #32 |\n| P1 suppliers, purchase orders, and partial receiving | `432d02814528db9097eee3595658b6953d30f669` | P1 Stacked Validation #46 |',
              'purchasing validated checkpoint',
          )
          text = replace_once(
              text,
              '- [ ] Purchase-order lines, partial receiving, vendor returns, and stock transfers.',
              '- [ ] Vendor returns and stock transfers.',
              'stock-ledger deferred purchasing scope',
          )
          old_section = '''## P1-B04 Purchase orders\n\nCurrent implementation target: `agent/p1-purchase-orders-receiving`\n\n- [ ] Add lines, supplier records, terms, and exact cost snapshots.\n- [ ] Add draft, submitted, partially received, received, and cancelled workflow.\n- [ ] Support partial receiving through stock-receipt movements.\n- [ ] Preserve price and quantity history.\n'''
          new_section = '''## P1-B04 Purchase orders\n\nCompleted and validated scope:\n\n- [x] Add first-class supplier records with stable codes, contact details, payment terms, and active/inactive policy.\n- [x] Add exact purchase-order lines with ingredient, purchasing-unit, conversion, quantity, and cost snapshots.\n- [x] Add draft, submitted, partially received, received, and cancelled workflow.\n- [x] Freeze commercial terms and lines after submission.\n- [x] Add idempotent purchase-order creation and controlled submission/cancellation.\n- [x] Support partial and full receiving through exact immutable stock-receipt movements.\n- [x] Serialize concurrent receipt attempts and prevent over-receiving.\n- [x] Preserve immutable receipt and receipt-line history.\n- [x] Add reviewed purchase-receipt correction through linked stock reversals.\n- [x] Prevent generic stock reversal from bypassing purchasing reconciliation.\n- [x] Adopt legacy supplier text and purchase-order headers without inventing line history.\n- [x] Add bilingual supplier, order, receiving, receipt, and correction operator workflows.\n- [x] Add Prisma mappings, exact-value omission policy, audit coverage, source inventories, database tests, and existing-data rehearsal.\n\nDeferred from this slice:\n\n- [ ] Supplier invoices, accounts payable, taxes, and payment scheduling.\n- [ ] Approval thresholds and multi-step procurement authorization.\n- [ ] Vendor returns, debit notes, and supplier credits.\n- [ ] Lots, batches, expiry dates, serial numbers, and multi-location receiving.\n- [ ] Weighted-average, FIFO, or another formal inventory valuation method.\n- [ ] Automatic reorder suggestions, supplier transmission, and document attachments.\n'''
          text = replace_once(text, old_section, new_section, 'P1-B04 completion section')
          text = replace_once(
              text,
              '- [x] Stock recipe snapshot: first production stores an immutable recipe version or a permanent untracked decision.',
              '- [x] Stock recipe snapshot: first production stores an immutable recipe version or a permanent untracked decision.\n- [x] Purchasing receipts: submitted terms are immutable; partial receipts and reviewed corrections reconcile atomically with the stock ledger.',
              'purchasing recorded decision',
          )
          text = replace_once(
              text,
              '| 2026-07-31 | Started first-class suppliers, exact purchase-order lines, partial receiving, and receipt-correction workflow. | `agent/p1-purchase-orders-receiving`. |',
              '| 2026-07-31 | Added first-class suppliers, exact purchase-order lines, immutable submitted terms, partial/full receiving, reviewed receipt correction, bilingual operator workflow, and full regression coverage. | P1 Stacked Validation #46 green at `432d028`. |',
              'purchasing change log',
          )
          path.write_text(text)
          PY

          git rm .github/workflows/agent-purchasing-roadmap-finalize.yml
          git add docs/REMEDIATION_PLAN.md
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: mark purchasing slice completed"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
