name: Agent timekeeping integration wiring

on:
  push:
    branches:
      - agent/p1-employee-timekeeping

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'feat: integrate immutable employee timekeeping' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-employee-timekeeping
          fetch-depth: 0

      - name: Apply reviewed timekeeping integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"Expected {label} marker was not found")
              return text.replace(old, new, 1)

          # Fix migration grouping and legacy-state eligibility before validation.
          path = Path('prisma/migrations/20260731235970_add_employee_timekeeping/migration.sql')
          text = path.read_text()
          text = replace_once(
              text,
              '''  CONSTRAINT "EmployeeShift_state_shape" CHECK (\n    "hourlyWageMinor" BETWEEN 0 AND 9007199254740991 AND\n    "baseLaborCostMinor" BETWEEN 0 AND 9007199254740991 AND\n    (\n      "status" = 'open' AND\n      "endedAt" IS NULL AND\n      "clockOutEventId" IS NULL AND\n      "grossSeconds" = 0 AND\n      "breakSeconds" = 0 AND\n      "paidSeconds" = 0 AND\n      "baseLaborCostMinor" = 0 AND\n      "closedAt" IS NULL\n    ) OR (\n      "status" = 'closed' AND\n      "endedAt" IS NOT NULL AND\n      "clockOutEventId" IS NOT NULL AND\n      "endedAt" >= "startedAt" AND\n      "grossSeconds" BETWEEN 0 AND 1209600 AND\n      "breakSeconds" BETWEEN 0 AND "grossSeconds" AND\n      "paidSeconds" = "grossSeconds" - "breakSeconds" AND\n      "closedAt" IS NOT NULL\n    )\n  )''',
              '''  CONSTRAINT "EmployeeShift_state_shape" CHECK (\n    "hourlyWageMinor" BETWEEN 0 AND 9007199254740991 AND\n    "baseLaborCostMinor" BETWEEN 0 AND 9007199254740991 AND\n    (\n      (\n        "status" = 'open' AND\n        "endedAt" IS NULL AND\n        "clockOutEventId" IS NULL AND\n        "grossSeconds" = 0 AND\n        "breakSeconds" = 0 AND\n        "paidSeconds" = 0 AND\n        "baseLaborCostMinor" = 0 AND\n        "closedAt" IS NULL\n      ) OR (\n        "status" = 'closed' AND\n        "endedAt" IS NOT NULL AND\n        "clockOutEventId" IS NOT NULL AND\n        "endedAt" >= "startedAt" AND\n        "grossSeconds" BETWEEN 0 AND 1209600 AND\n        "breakSeconds" BETWEEN 0 AND "grossSeconds" AND\n        "paidSeconds" = "grossSeconds" - "breakSeconds" AND\n        "closedAt" IS NOT NULL\n      )\n    )\n  )''',
              'employee shift state constraint',
          )
          text = replace_once(
              text,
              '''  AND (\n    employee."clockedIn" OR\n    employee."lastClockOut" IS NULL OR\n    employee."lastClockOut" >= employee."lastClockIn"\n  );''',
              '''  AND (\n    employee."clockedIn" OR\n    (\n      employee."lastClockOut" IS NOT NULL AND\n      employee."lastClockOut" >= employee."lastClockIn"\n    )\n  );''',
              'legacy clock-state eligibility',
          )
          path.write_text(text)

          # First-class Prisma enums, policy fields, and ledger models.
          path = Path('prisma/schema.prisma')
          schema = path.read_text()
          schema = replace_once(
              schema,
              '''enum PurchaseReceiptStatus {\n  posted\n  reversed\n}\n''',
              '''enum PurchaseReceiptStatus {\n  posted\n  reversed\n}\n\nenum TimeEventType {\n  clock_in\n  clock_out\n  break_start\n  break_end\n}\n\nenum TimeEventSource {\n  kiosk\n  manager\n  import\n  system\n}\n\nenum TimeShiftStatus {\n  open\n  closed\n}\n''',
              'timekeeping enums',
          )
          schema = replace_once(
              schema,
              '''  openTime               String   @default("09:00")\n  closeTime              String   @default("23:00")''',
              '''  openTime               String   @default("09:00")\n  closeTime              String   @default("23:00")\n  timezone               String   @default("UTC")\n  operationalDayStartMinutes Int  @default(0)''',
              'restaurant time policy fields',
          )
          schema = replace_once(
              schema,
              '''  schedules       Schedule[]\n  createdAt       DateTime   @default(now())''',
              '''  schedules       Schedule[]\n  timeEvents      EmployeeTimeEvent[]\n  shifts          EmployeeShift[]\n  createdAt       DateTime   @default(now())''',
              'employee timekeeping relations',
          )
          models = r'''
model EmployeeTimeEvent {
  id              String          @id
  idempotencyKey  String          @unique(map: "EmployeeTimeEvent_idempotencyKey_key")
  employeeId      String
  employee        Employee        @relation(fields: [employeeId], references: [id], onDelete: Restrict)
  eventType       TimeEventType
  source          TimeEventSource
  occurredAt      DateTime        @db.Timestamptz(3)
  operationalDate DateTime        @db.Date
  actorId         String?
  actorName       String          @default("")
  actorRole       String          @default("")
  reasonCode      String          @default("")
  reason          String?
  metadata        Json?
  createdAt       DateTime        @default(now()) @db.Timestamptz(3)
  clockInShift    EmployeeShift?  @relation("EmployeeShiftClockIn")
  clockOutShift   EmployeeShift?  @relation("EmployeeShiftClockOut")
  startedBreak    EmployeeBreak?  @relation("EmployeeBreakStart")
  endedBreak      EmployeeBreak?  @relation("EmployeeBreakEnd")

  @@index([employeeId, occurredAt(sort: Desc)], map: "EmployeeTimeEvent_employee_occurredAt_idx")
  @@index([operationalDate, occurredAt], map: "EmployeeTimeEvent_operationalDate_idx")
  @@index([eventType, createdAt(sort: Desc)], map: "EmployeeTimeEvent_type_createdAt_idx")
}

model EmployeeShift {
  id                 String                   @id
  employeeId         String
  employee           Employee                 @relation(fields: [employeeId], references: [id], onDelete: Restrict)
  status             TimeShiftStatus          @default(open)
  operationalDate    DateTime                 @db.Date
  startedAt          DateTime                 @db.Timestamptz(3)
  endedAt            DateTime?                @db.Timestamptz(3)
  clockInEventId     String                   @unique(map: "EmployeeShift_clockInEventId_key")
  clockInEvent       EmployeeTimeEvent        @relation("EmployeeShiftClockIn", fields: [clockInEventId], references: [id], onDelete: Restrict)
  clockOutEventId    String?                  @unique(map: "EmployeeShift_clockOutEventId_key")
  clockOutEvent      EmployeeTimeEvent?       @relation("EmployeeShiftClockOut", fields: [clockOutEventId], references: [id], onDelete: Restrict)
  grossSeconds       Int                      @default(0)
  breakSeconds       Int                      @default(0)
  paidSeconds        Int                      @default(0)
  hourlyWageMinor    BigInt
  baseLaborCostMinor BigInt                   @default(0)
  openedById         String?
  openedByName       String                   @default("")
  closedById         String?
  closedByName       String?
  createdAt          DateTime                 @default(now()) @db.Timestamptz(3)
  closedAt           DateTime?                @db.Timestamptz(3)
  breaks             EmployeeBreak[]
  adjustments        EmployeeTimeAdjustment[]

  @@index([employeeId, operationalDate(sort: Desc), startedAt(sort: Desc)], map: "EmployeeShift_employee_operationalDate_idx")
  @@index([status, startedAt], map: "EmployeeShift_status_startedAt_idx")
}

model EmployeeBreak {
  id              String            @id
  shiftId         String
  shift           EmployeeShift     @relation(fields: [shiftId], references: [id], onDelete: Restrict)
  status          TimeShiftStatus   @default(open)
  startedAt       DateTime          @db.Timestamptz(3)
  endedAt         DateTime?         @db.Timestamptz(3)
  startEventId    String            @unique(map: "EmployeeBreak_startEventId_key")
  startEvent      EmployeeTimeEvent @relation("EmployeeBreakStart", fields: [startEventId], references: [id], onDelete: Restrict)
  endEventId      String?           @unique(map: "EmployeeBreak_endEventId_key")
  endEvent        EmployeeTimeEvent? @relation("EmployeeBreakEnd", fields: [endEventId], references: [id], onDelete: Restrict)
  durationSeconds Int               @default(0)
  openedById      String?
  openedByName    String            @default("")
  closedById      String?
  closedByName    String?
  createdAt       DateTime          @default(now()) @db.Timestamptz(3)
  closedAt        DateTime?         @db.Timestamptz(3)

  @@index([shiftId, startedAt], map: "EmployeeBreak_shift_startedAt_idx")
}

model EmployeeTimeAdjustment {
  id                  String        @id
  idempotencyKey      String        @unique(map: "EmployeeTimeAdjustment_idempotencyKey_key")
  shiftId             String
  shift               EmployeeShift @relation(fields: [shiftId], references: [id], onDelete: Restrict)
  paidSecondsDelta    Int
  laborCostDeltaMinor BigInt
  reasonCode          String
  reason              String
  actorId             String
  actorName           String
  actorRole           String
  createdAt           DateTime      @default(now()) @db.Timestamptz(3)

  @@index([shiftId, createdAt], map: "EmployeeTimeAdjustment_shift_createdAt_idx")
  @@index([actorId, createdAt(sort: Desc)], map: "EmployeeTimeAdjustment_actor_createdAt_idx")
}

'''
          schema = replace_once(
              schema,
              '// ─── Inventory ───\nmodel Ingredient {',
              models + '// ─── Inventory ───\nmodel Ingredient {',
              'timekeeping models',
          )
          path.write_text(schema)

          # BigInt JSON safety.
          path = Path('src/lib/db.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '  employee: { hourlyWageMinor: true },',
              '''  employee: { hourlyWageMinor: true },\n  employeeShift: {\n    hourlyWageMinor: true,\n    baseLaborCostMinor: true,\n  },\n  employeeTimeAdjustment: { laborCostDeltaMinor: true },''',
              'timekeeping omit policy',
          )
          path.write_text(text)

          # Permanent integration command.
          path = Path('package.json')
          text = path.read_text()
          text = replace_once(
              text,
              'bun tests/integration/p1-purchase-orders-receiving.ts",',
              'bun tests/integration/p1-purchase-orders-receiving.ts && bun tests/integration/p1-employee-timekeeping.ts",',
              'timekeeping integration command',
          )
          path.write_text(text)

          # Time policy controls in settings.
          path = Path('src/components/admin/tabs/SettingsTab.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              '''              <div className="grid grid-cols-2 gap-3">\n                <Field label={isRTL ? "وقت الفتح" : "Open Time"} value={form.openTime} onChange={(v) => set("openTime", v)} dir="ltr" type="time" />\n                <Field label={isRTL ? "وقت الإغلاق" : "Close Time"} value={form.closeTime} onChange={(v) => set("closeTime", v)} dir="ltr" type="time" />\n              </div>\n              <Field label={isRTL ? "متوسط وقت التحضير (دقيقة)" : "Avg Prep Time (min)"}''',
              '''              <div className="grid grid-cols-2 gap-3">\n                <Field label={isRTL ? "وقت الفتح" : "Open Time"} value={form.openTime} onChange={(v) => set("openTime", v)} dir="ltr" type="time" />\n                <Field label={isRTL ? "وقت الإغلاق" : "Close Time"} value={form.closeTime} onChange={(v) => set("closeTime", v)} dir="ltr" type="time" />\n              </div>\n              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">\n                <Field label={isRTL ? "المنطقة الزمنية" : "Restaurant Timezone"} value={form.timezone || "UTC"} onChange={(v) => set("timezone", v)} dir="ltr" />\n                <Field label={isRTL ? "بداية يوم التشغيل (دقائق بعد منتصف الليل)" : "Operational day starts (minutes after midnight)"} value={String(form.operationalDayStartMinutes ?? 0)} onChange={(v) => set("operationalDayStartMinutes", Math.max(0, Math.min(1439, parseInt(v) || 0)))} dir="ltr" type="number" />\n              </div>\n              <p className="text-xs text-muted-foreground">\n                {isRTL ? "مثال بغداد: Asia/Baghdad. استخدم 240 ليبدأ يوم التشغيل الساعة 04:00." : "Example: Asia/Baghdad. Use 240 for an operational day that starts at 04:00."}\n              </p>\n              <Field label={isRTL ? "متوسط وقت التحضير (دقيقة)" : "Avg Prep Time (min)"}''',
              'time policy settings UI',
          )
          path.write_text(text)

          # Settings compatibility defaults for older clients.
          path = Path('src/app/api/settings/route.ts')
          text = path.read_text()
          text = text.replace('timezone: z.string().trim().min(1).max(80),', 'timezone: z.string().trim().min(1).max(80).default("UTC"),')
          text = text.replace('operationalDayStartMinutes: z.number().int().min(0).max(1_439),', 'operationalDayStartMinutes: z.number().int().min(0).max(1_439).default(0),')
          path.write_text(text)

          # Employee lifecycle guards.
          path = Path('src/app/api/employees/[id]/route.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '''    if (\n      auth.session.role !== "owner" &&\n      (target.role === "owner" || parsed.data.role === "owner")\n    ) {\n      return NextResponse.json(\n        { error: "Only an owner can manage owner accounts", code: "PERMISSION_DENIED" },\n        { status: 403 }\n      );\n    }\n\n    const { pin, ...employeeData } = parsed.data;''',
              '''    if (\n      auth.session.role !== "owner" &&\n      (target.role === "owner" || parsed.data.role === "owner")\n    ) {\n      return NextResponse.json(\n        { error: "Only an owner can manage owner accounts", code: "PERMISSION_DENIED" },\n        { status: 403 }\n      );\n    }\n\n    if (parsed.data.isActive === false) {\n      const openShift = await db.employeeShift.findFirst({\n        where: { employeeId: id, status: "open" },\n        select: { id: true },\n      });\n      if (openShift) {\n        return NextResponse.json(\n          { error: "Clock the employee out before deactivation", code: "EMPLOYEE_HAS_OPEN_SHIFT" },\n          { status: 409 }\n        );\n      }\n    }\n\n    const { pin, ...employeeData } = parsed.data;''',
              'employee deactivation guard',
          )
          text = replace_once(
              text,
              '''    if (target.role === "owner" && auth.session.role !== "owner") {\n      return NextResponse.json(\n        { error: "Only an owner can delete an owner account", code: "PERMISSION_DENIED" },\n        { status: 403 }\n      );\n    }\n\n    const context = auditContextFromRequest(req);''',
              '''    if (target.role === "owner" && auth.session.role !== "owner") {\n      return NextResponse.json(\n        { error: "Only an owner can delete an owner account", code: "PERMISSION_DENIED" },\n        { status: 403 }\n      );\n    }\n\n    const [openShift, timeHistoryCount] = await Promise.all([\n      db.employeeShift.findFirst({\n        where: { employeeId: id, status: "open" },\n        select: { id: true },\n      }),\n      db.employeeTimeEvent.count({ where: { employeeId: id } }),\n    ]);\n    if (openShift) {\n      return NextResponse.json(\n        { error: "Clock the employee out before deletion", code: "EMPLOYEE_HAS_OPEN_SHIFT" },\n        { status: 409 }\n      );\n    }\n    if (timeHistoryCount > 0) {\n      return NextResponse.json(\n        { error: "Employees with timekeeping history cannot be deleted; deactivate them instead", code: "EMPLOYEE_HAS_TIME_HISTORY" },\n        { status: 409 }\n      );\n    }\n\n    const context = auditContextFromRequest(req);''',
              'employee history deletion guard',
          )
          path.write_text(text)

          # P0 compatibility: keep response and legacy audit contract while adding ledger audit.
          path = Path('src/app/api/employees/clock/route.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '''    const { pin, employeeId } = parsed.data;\n    const action = normalizedAction(parsed.data.action);''',
              '''    const { pin, employeeId } = parsed.data;\n    if (\n      employeeId && parsed.data.occurredAt &&\n      (!parsed.data.reasonCode || (parsed.data.reason || "").trim().length < 3)\n    ) {\n      return NextResponse.json(\n        { error: "Backdated manager events require a reason code and explanation", code: "MANAGER_CLOCK_REASON_REQUIRED" },\n        { status: 400 }\n      );\n    }\n    const action = normalizedAction(parsed.data.action);''',
              'manager backdate reason guard',
          )
          text = replace_once(
              text,
              '''        await writeAuditEvent(tx, {\n          actor,\n          action: `employee.time.${action}`,\n          entityType: "EmployeeTimeEvent",\n          entityId: saved.event.id,\n          context,\n          metadata: {\n            employeeId: targetEmployeeId,\n            source: managerSession ? "manager" : "kiosk",\n            occurredAt: saved.event.occurredAt,\n            operationalDate: saved.event.operationalDate,\n            shiftId: saved.employee.shiftId,\n            onBreak: saved.employee.onBreak,\n          },\n        });''',
              '''        await writeAuditEvent(tx, {\n          actor,\n          action: `employee.time.${action}`,\n          entityType: "EmployeeTimeEvent",\n          entityId: saved.event.id,\n          context,\n          metadata: {\n            employeeId: targetEmployeeId,\n            source: managerSession ? "manager" : "kiosk",\n            occurredAt: saved.event.occurredAt,\n            operationalDate: saved.event.operationalDate,\n            shiftId: saved.employee.shiftId,\n            onBreak: saved.employee.onBreak,\n          },\n        });\n        if (action === "clock_in" || action === "clock_out") {\n          await writeAuditEvent(tx, {\n            actor,\n            action: action === "clock_in" ? "employee.clock.in" : "employee.clock.out",\n            entityType: "Employee",\n            entityId: targetEmployeeId,\n            context,\n            metadata: {\n              via: pin ? "pin" : "manager",\n              timeEventId: saved.event.id,\n              occurredAt: saved.event.occurredAt,\n            },\n          });\n        }''',
              'legacy clock audit compatibility',
          )
          text = text.replace('status: result.replayed ? 200 : 201,', 'status: 200,')
          path.write_text(text)

          # Historical report contains immutable closed shifts only.
          path = Path('src/lib/timekeeping/timekeeping.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '''    WHERE shift."operationalDate" BETWEEN ${options.from}::date AND ${options.to}::date\n      ${employeeFilter}''',
              '''    WHERE shift."status" = 'closed'\n      AND shift."operationalDate" BETWEEN ${options.from}::date AND ${options.to}::date\n      ${employeeFilter}''',
              'closed shift report filter',
          )
          path.write_text(text)

          # Existing lockout test cleanup must preserve immutable time history.
          path = Path('tests/integration/p0-login-lockout.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '''      await db.$transaction(async (tx) => {\n        await tx.staffSession.deleteMany({\n          where: { employeeId: cleanupTargetId },\n        });\n        await tx.schedule.deleteMany({\n          where: { employeeId: cleanupTargetId },\n        });\n        await tx.employee.deleteMany({ where: { id: cleanupTargetId } });\n      });''',
              '''      await db.$transaction(async (tx) => {\n        await tx.staffSession.deleteMany({\n          where: { employeeId: cleanupTargetId },\n        });\n        await tx.schedule.deleteMany({\n          where: { employeeId: cleanupTargetId },\n        });\n        await tx.employee.updateMany({\n          where: { id: cleanupTargetId },\n          data: { isActive: false },\n        });\n      });''',
              'p0 time-history cleanup',
          )
          path.write_text(text)

          # New test expects the preserved HTTP 200 compatibility contract and open-shift guard.
          path = Path('tests/integration/p1-employee-timekeeping.ts')
          text = path.read_text()
          text = text.replace('assertStatus(clockIn.response, 201, "Manager clock in");', 'assertStatus(clockIn.response, 200, "Manager clock in");')
          text = text.replace('assertStatus(breakStart.response, 201, "Break start");', 'assertStatus(breakStart.response, 200, "Break start");')
          text = text.replace('assertStatus(breakEnd.response, 201, "Break end");', 'assertStatus(breakEnd.response, 200, "Break end");')
          text = text.replace('assertStatus(clockOut.response, 201, "Manager clock out");', 'assertStatus(clockOut.response, 200, "Manager clock out");')
          text = text.replace('assertStatus(kioskIn.response, 201, "Kiosk clock in");', 'assertStatus(kioskIn.response, 200, "Kiosk clock in");')
          text = text.replace('assertStatus(kioskOut.response, 201, "Kiosk clock out");', 'assertStatus(kioskOut.response, 200, "Kiosk clock out");')
          text = text.replace('    [201, 409]\n', '    [200, 409]\n')
          text = text.replace('assertStatus(raceOut.response, 201, "Close concurrency-test shift");', 'assertStatus(raceOut.response, 200, "Close concurrency-test shift");')
          marker = '''  const deactivateWithOpenShift = await api<any>(\n    `/api/employees/${encodeURIComponent(raceEmployee.id)}`,\n    {\n      method: "PATCH",\n      headers: { cookie: adminCookie },\n      body: JSON.stringify({ isActive: false }),\n    }\n  );\n  assertStatus(deactivateWithOpenShift.response, 200, "Deactivate after shift closure");'''
          replacement = '''  const openEmployee = await createEmployee(\n    adminCookie,\n    `P1 Open Shift ${suffix}`,\n    13\n  );\n  const openIn = await managerClock(\n    adminCookie,\n    openEmployee.id,\n    "clock_in",\n    new Date(Date.now() - 60_000)\n  );\n  assertStatus(openIn.response, 200, "Open deactivation-test shift");\n  const deactivateWithOpenShift = await api<any>(\n    `/api/employees/${encodeURIComponent(openEmployee.id)}`,\n    {\n      method: "PATCH",\n      headers: { cookie: adminCookie },\n      body: JSON.stringify({ isActive: false }),\n    }\n  );\n  assertStatus(deactivateWithOpenShift.response, 409, "Deactivate with open shift");\n  assert.equal(deactivateWithOpenShift.data.code, "EMPLOYEE_HAS_OPEN_SHIFT");\n  const openOut = await managerClock(\n    adminCookie,\n    openEmployee.id,\n    "clock_out",\n    new Date()\n  );\n  assertStatus(openOut.response, 200, "Close deactivation-test shift");'''
          text = replace_once(text, marker, replacement, 'open shift deactivation test')
          path.write_text(text)

          # Domain enum catalog and generated-client round trips.
          path = Path('tests/integration/p1-domain-integrity.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '  TableStatus,\n  WaitlistStatus,',
              '  TableStatus,\n  TimeEventSource,\n  TimeEventType,\n  TimeShiftStatus,\n  WaitlistStatus,',
              'timekeeping enum imports',
          )
          text = replace_once(
              text,
              '  PurchaseReceiptStatus: ["posted", "reversed"],\n};',
              '''  PurchaseReceiptStatus: ["posted", "reversed"],\n  TimeEventType: ["clock_in", "clock_out", "break_start", "break_end"],\n  TimeEventSource: ["kiosk", "manager", "import", "system"],\n  TimeShiftStatus: ["open", "closed"],\n};''',
              'timekeeping enum catalog',
          )
          text = replace_once(
              text,
              '  assert.equal(PurchaseReceiptStatus.reversed, "reversed");\n}',
              '''  assert.equal(PurchaseReceiptStatus.reversed, "reversed");\n  assert.equal(TimeEventType.break_start, "break_start");\n  assert.equal(TimeEventSource.manager, "manager");\n  assert.equal(TimeShiftStatus.closed, "closed");\n}''',
              'timekeeping enum round trips',
          )
          path.write_text(text)

          # Roadmap reconciliation.
          path = Path('docs/REMEDIATION_PLAN.md')
          text = path.read_text()
          text = text.replace('> **Tracking branch:** `agent/p1-purchase-orders-receiving`', '> **Tracking branch:** `agent/p1-employee-timekeeping`')
          text = text.replace('| P1-B01 | Cash-register sessions and reconciliation | Completed and validated |', '| P1-B01 | Cash-register sessions and reconciliation | Completed and validated |\n| P1-B02 | Immutable employee timekeeping | In progress on `agent/p1-employee-timekeeping` |')
          text = text.replace('                    └── agent/p1-purchase-orders-receiving\n', '                    └── agent/p1-purchase-orders-receiving\n                        └── agent/p1-employee-timekeeping\n')
          text = text.replace('## P1-B02 Employee timekeeping\n\n- [ ] Add immutable clock, break, and shift entries.\n- [ ] Support audited manager corrections instead of rewriting historical state.\n- [ ] Calculate hours from events.\n- [ ] Define overnight-shift and restaurant-timezone behavior.', '''## P1-B02 Employee timekeeping\n\nCurrent implementation target on `agent/p1-employee-timekeeping`:\n\n- [ ] Add immutable clock-in, clock-out, break-start, and break-end events.\n- [ ] Add one open shift per employee and immutable closed shift summaries.\n- [ ] Snapshot exact hourly wage and labor cost on shift close.\n- [ ] Add signed, append-only manager time adjustments instead of rewriting history.\n- [ ] Add restaurant timezone and operational-day boundary for overnight shifts.\n- [ ] Keep legacy employee clock fields as guarded compatibility caches.\n- [ ] Block employee deactivation with an open shift and deletion with time history.\n- [ ] Add bilingual live-state, break, history, and correction workflow.\n- [ ] Add clean/legacy migration, concurrency, immutability, and regression tests.''')
          text = text.replace('- [ ] Restaurant timezone and operational-day boundary.', '- [x] Restaurant timezone and operational-day boundary for timekeeping; revenue/reservation adoption remains open.')
          text += '\n'
          path.write_text(text)
          PY

      - name: Remove one-off workflow and commit
        run: |
          git rm .github/workflows/agent-timekeeping-wiring.yml
          git add -A
          git config user.name "OpenAI Agent"
