name: Apply waitlist repository wiring from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-waitlist-wiring-pr
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'agent/p1-waitlist-operations' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed waitlist seed adoption
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-waitlist-seed.py

          if git diff --quiet; then
            echo "Waitlist seed adoption is already applied."
            exit 0
          fi

          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/seed.ts
          git commit -m "fix: seed valid waitlist lifecycle snapshots"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
