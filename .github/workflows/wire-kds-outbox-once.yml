name: Wire Durable KDS Outbox Once

on:
  push:
    branches:
      - agent/p0-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: wire-kds-outbox-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  wire:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Normalize one-off script literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/wire-kds-outbox.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '        """main().catch((error) => {',
              '        r"""main().catch((error) => {',
              1,
          )
          text = text.replace(
              '        """main()\n  .catch((error) => {',
              '        r"""main()\n  .catch((error) => {',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Wire transactional KDS events
        run: python3 scripts/wire-kds-outbox.py

      - name: Restore one-off script
        run: git restore scripts/wire-kds-outbox.py

      - name: Commit source changes when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Durable KDS outbox wiring is already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "src/app/api/orders/route.ts" \
            "src/app/api/orders/[id]/route.ts" \
            "src/app/api/orders/items/[id]/route.ts" \
            "src/app/api/kitchen/route.ts" \
            "tests/integration/p0-smoke.ts"
          git commit -m "security: wire transactional KDS outbox events"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
