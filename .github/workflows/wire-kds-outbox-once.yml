name: Wire Durable KDS Outbox Once

on:
  push:
    branches:
      - agent/p0-hardening

permissions:
  contents: write

concurrency:
  group: wire-kds-outbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Wire transactional KDS events
        run: python3 scripts/wire-kds-outbox.py

      - name: Commit source changes when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Durable KDS outbox wiring is already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "src/app/api/orders/route.ts" \
            "src/app/api/orders/[id]/route.ts" \
            "src/app/api/orders/items/[id]/route.ts" \
            "src/app/api/kitchen/route.ts" \
            "tests/integration/p0-smoke.ts"
          git commit -m "security: wire transactional KDS outbox events"
          git push origin HEAD:${GITHUB_REF_NAME}
