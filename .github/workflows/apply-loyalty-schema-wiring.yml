name: Apply loyalty schema and seed wiring

on:
  push:
    branches:
      - agent/p1-loyalty-gift-cards

permissions:
  contents: write

concurrency:
  group: apply-loyalty-schema-wiring
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'feat: wire loyalty and gift-card schema' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-loyalty-gift-cards
          fetch-depth: 0

      - name: Wire Prisma, settings, roles, and seed data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              return text.replace(old, new, 1)

          schema_path = Path('prisma/schema.prisma')
          schema = schema_path.read_text()
          schema = replace_once(
              schema,
              '''enum PaymentMethod {
  cash
  card
  split
}''',
              '''enum PaymentMethod {
  cash
  card
  split
  gift_card
}''',
              'PaymentMethod enum',
          )
          schema = replace_once(
              schema,
              '''enum PaymentEventStatus {
  pending
  succeeded
  failed
  voided
}
''',
              '''enum PaymentEventStatus {
  pending
  succeeded
  failed
  voided
}

enum LoyaltyPointEventType {
  opening_balance
  earn
  redeem
  earn_reversal
  redeem_restore
  adjustment
}

enum GiftCardStatus {
  active
  exhausted
  voided
  expired
}

enum GiftCardTransactionType {
  opening_balance
  issue
  redeem
  refund
  adjustment
  void
  expiration
}
''',
              'ledger enums',
          )
          schema = replace_once(
              schema,
              '''  giftCardAmounts            String   @default("25,50,75,100")
''',
              '''  giftCardAmounts            String   @default("25,50,75,100")
  loyaltyEnabled                         Boolean  @default(true)
  loyaltyPointsPerCurrencyUnit           Int      @default(1)
  loyaltyRedemptionPointsPerCurrencyUnit Int      @default(100)
  loyaltyRedemptionIncrementPoints       Int      @default(100)
  loyaltyMaxRedemptionPercent            Int      @default(100)
  giftCardEnabled                        Boolean  @default(true)
  giftCardDefaultExpiryDays              Int      @default(0)
''',
              'settings policy fields',
          )
          schema = replace_once(
              schema,
              '''  waitlistEntries  WaitlistEntry[]
  createdAt        DateTime        @default(now())''',
              '''  waitlistEntries  WaitlistEntry[]
  loyaltyEvents    LoyaltyPointEvent[]
  createdAt        DateTime        @default(now())''',
              'customer relation',
          )
          schema = replace_once(
              schema,
              '''  paymentEvents       PaymentEvent[]
  estimatedReady      DateTime?''',
              '''  paymentEvents       PaymentEvent[]
  loyaltyEvents       LoyaltyPointEvent[]
  giftCardTransactions GiftCardTransaction[]
  estimatedReady      DateTime?''',
              'order relations',
          )
          old_gift = '''model GiftCard {
  id            String    @id @default(cuid())
  code          String    @unique
  amount        Float
  amountMinor   BigInt    @default(0)
  balance       Float
  balanceMinor  BigInt    @default(0)
  purchaserName String
  recipientName String
  message       String?
  template      String    @default("birthday")
  isRedeemed    Boolean   @default(false)
  redeemedAt    DateTime?
  createdAt     DateTime  @default(now())
  updatedAt     DateTime  @updatedAt
}
'''
          new_gift = '''model GiftCard {
  id                    String                @id @default(cuid())
  code                  String                @unique
  redemptionCodeHash    String                @unique(map: "GiftCard_redemptionCodeHash_key")
  redemptionCodeLast4   String
  amount                Float
  amountMinor           BigInt                @default(0)
  balance               Float
  balanceMinor          BigInt                @default(0)
  purchaserName         String
  recipientName         String
  message               String?
  template              String                @default("birthday")
  status                GiftCardStatus        @default(active)
  currency              String                @default("USD")
  isRedeemed            Boolean               @default(false)
  redeemedAt            DateTime?             @db.Timestamptz(3)
  issuedAt              DateTime              @default(now()) @db.Timestamptz(3)
  expiresAt             DateTime?             @db.Timestamptz(3)
  voidedAt              DateTime?             @db.Timestamptz(3)
  issuedById            String?
  issuedByName          String                @default("")
  transactions          GiftCardTransaction[]
  createdAt             DateTime              @default(now())
  updatedAt             DateTime              @updatedAt

  @@index([status, createdAt(sort: Desc)], map: "GiftCard_status_createdAt_idx")
  @@index([redemptionCodeLast4, createdAt(sort: Desc)], map: "GiftCard_last4_createdAt_idx")
  @@index([expiresAt], map: "GiftCard_expiresAt_idx")
}

model LoyaltyPointEvent {
  id             String                @id
  idempotencyKey String                @unique(map: "LoyaltyPointEvent_idempotencyKey_key")
  customerId     String
  customer       Customer              @relation(fields: [customerId], references: [id], onDelete: Restrict)
  eventType      LoyaltyPointEventType
  pointsDelta    Int
  balanceAfter   Int                   @default(0)
  orderId        String?
  order          Order?                @relation(fields: [orderId], references: [id], onDelete: Restrict)
  paymentEventId String?
  paymentEvent   PaymentEvent?         @relation(fields: [paymentEventId], references: [id], onDelete: Restrict)
  parentEventId  String?
  parentEvent    LoyaltyPointEvent?    @relation("LoyaltyPointEventReversals", fields: [parentEventId], references: [id], onDelete: Restrict)
  reversals      LoyaltyPointEvent[]   @relation("LoyaltyPointEventReversals")
  actorId        String?
  actorName      String                @default("")
  actorRole      String                @default("")
  reasonCode     String                @default("")
  reason         String?
  metadata       Json?
  occurredAt     DateTime              @default(now()) @db.Timestamptz(3)
  createdAt      DateTime              @default(now()) @db.Timestamptz(3)

  @@index([customerId, createdAt(sort: Desc)], map: "LoyaltyPointEvent_customer_createdAt_idx")
  @@index([orderId, createdAt(sort: Desc)], map: "LoyaltyPointEvent_order_createdAt_idx")
  @@index([paymentEventId, eventType, createdAt(sort: Desc)], map: "LoyaltyPointEvent_payment_type_idx")
  @@index([parentEventId, createdAt(sort: Desc)], map: "LoyaltyPointEvent_parent_createdAt_idx")
}

model GiftCardTransaction {
  id                  String                  @id
  idempotencyKey      String                  @unique(map: "GiftCardTransaction_idempotencyKey_key")
  giftCardId          String
  giftCard            GiftCard                @relation(fields: [giftCardId], references: [id], onDelete: Restrict)
  transactionType     GiftCardTransactionType
  amountMinor         BigInt
  balanceAfterMinor   BigInt                  @default(0)
  orderId             String?
  order               Order?                  @relation(fields: [orderId], references: [id], onDelete: Restrict)
  paymentEventId      String?
  paymentEvent        PaymentEvent?           @relation(fields: [paymentEventId], references: [id], onDelete: Restrict)
  parentTransactionId String?
  parentTransaction   GiftCardTransaction?    @relation("GiftCardTransactionReversals", fields: [parentTransactionId], references: [id], onDelete: Restrict)
  reversals           GiftCardTransaction[]   @relation("GiftCardTransactionReversals")
  actorId             String?
  actorName           String                  @default("")
  actorRole           String                  @default("")
  reasonCode          String                  @default("")
  reason              String?
  metadata            Json?
  occurredAt          DateTime                @default(now()) @db.Timestamptz(3)
  createdAt           DateTime                @default(now()) @db.Timestamptz(3)

  @@index([giftCardId, createdAt(sort: Desc)], map: "GiftCardTransaction_card_createdAt_idx")
  @@index([orderId, createdAt(sort: Desc)], map: "GiftCardTransaction_order_createdAt_idx")
  @@index([paymentEventId, transactionType, createdAt(sort: Desc)], map: "GiftCardTransaction_payment_type_idx")
  @@index([parentTransactionId, createdAt(sort: Desc)], map: "GiftCardTransaction_parent_createdAt_idx")
}
'''
          schema = replace_once(schema, old_gift, new_gift, 'gift-card model')
          schema = replace_once(
              schema,
              '''  reversals         PaymentEvent[]       @relation("PaymentEventReversals")
  reasonCode       String               @default("")''',
              '''  reversals         PaymentEvent[]       @relation("PaymentEventReversals")
  loyaltyEvents    LoyaltyPointEvent[]
  giftCardTransactions GiftCardTransaction[]
  reasonCode       String               @default("")''',
              'payment event relations',
          )
          schema_path.write_text(schema)

          db_path = Path('src/lib/db.ts')
          db = db_path.read_text()
          db = replace_once(
              db,
              '''  giftCard: {
    amountMinor: true,
    balanceMinor: true,
  },''',
              '''  giftCard: {
    amountMinor: true,
    balanceMinor: true,
  },
  giftCardTransaction: {
    amountMinor: true,
    balanceAfterMinor: true,
  },''',
              'BigInt omission',
          )
          db_path.write_text(db)

          roles_path = Path('src/lib/auth/roles.ts')
          roles = roles_path.read_text()
          roles = replace_once(
              roles,
              '''export const TABLE_OPERATION_ROLES = [
  "owner",
  "admin",
  "manager",
  "cashier",
  "server",
  "host",
] as const;
''',
              '''export const TABLE_OPERATION_ROLES = [
  "owner",
  "admin",
  "manager",
  "cashier",
  "server",
  "host",
] as const;
export const LOYALTY_READ_ROLES = [
  "owner",
  "admin",
  "manager",
  "cashier",
] as const;
export const LOYALTY_MANAGEMENT_ROLES = [
  "owner",
  "admin",
  "manager",
] as const;
''',
              'loyalty roles',
          )
          roles_path.write_text(roles)

          guard_path = Path('src/lib/auth/guard.ts')
          guard = guard_path.read_text()
          guard = replace_once(
              guard,
              '''  KITCHEN_OPERATION_ROLES,
  MENU_MANAGEMENT_ROLES,''',
              '''  KITCHEN_OPERATION_ROLES,
  LOYALTY_MANAGEMENT_ROLES,
  LOYALTY_READ_ROLES,
  MENU_MANAGEMENT_ROLES,''',
              'guard role exports',
          )
          guard_path.write_text(guard)

          settings_path = Path('src/app/api/settings/route.ts')
          settings = settings_path.read_text()
          settings = replace_once(
              settings,
              '''    giftCardAmounts: z.string().trim().max(240),
    statsOrdersServed:''',
              '''    giftCardAmounts: z.string().trim().max(240),
    loyaltyEnabled: z.boolean(),
    loyaltyPointsPerCurrencyUnit: z.number().int().min(0).max(1_000_000),
    loyaltyRedemptionPointsPerCurrencyUnit: z.number().int().min(1).max(1_000_000_000),
    loyaltyRedemptionIncrementPoints: z.number().int().min(1).max(1_000_000_000),
    loyaltyMaxRedemptionPercent: z.number().int().min(1).max(100),
    giftCardEnabled: z.boolean(),
    giftCardDefaultExpiryDays: z.number().int().min(0).max(36_500),
    statsOrdersServed:''',
              'settings schema',
          )
          settings = replace_once(
              settings,
              '''          operationalDayStartMinutes: saved.operationalDayStartMinutes,
          kdsThresholds:''',
              '''          operationalDayStartMinutes: saved.operationalDayStartMinutes,
          loyaltyPolicy: {
            enabled: saved.loyaltyEnabled,
            pointsPerCurrencyUnit: saved.loyaltyPointsPerCurrencyUnit,
            redemptionPointsPerCurrencyUnit: saved.loyaltyRedemptionPointsPerCurrencyUnit,
            redemptionIncrementPoints: saved.loyaltyRedemptionIncrementPoints,
            maxRedemptionPercent: saved.loyaltyMaxRedemptionPercent,
          },
          giftCardPolicy: {
            enabled: saved.giftCardEnabled,
            defaultExpiryDays: saved.giftCardDefaultExpiryDays,
          },
          kdsThresholds:''',
              'settings audit',
          )
          settings_path.write_text(settings)

          settings_ui_path = Path('src/components/admin/tabs/SettingsTab.tsx')
          settings_ui = settings_ui_path.read_text()
          settings_ui = replace_once(
              settings_ui,
              '''  Instagram, Twitter, MessageCircle,
} from "lucide-react";''',
              '''  Instagram, Twitter, MessageCircle, Gift,
} from "lucide-react";''',
              'settings icon',
          )
          settings_ui = replace_once(
              settings_ui,
              '''          <TabsTrigger value="fees" className="gap-1.5"><DollarSign className="size-3.5" />{isRTL ? "رسوم" : "Fees"}</TabsTrigger>
          <TabsTrigger value="social"''',
              '''          <TabsTrigger value="fees" className="gap-1.5"><DollarSign className="size-3.5" />{isRTL ? "رسوم" : "Fees"}</TabsTrigger>
          <TabsTrigger value="loyalty" className="gap-1.5"><Gift className="size-3.5" />{isRTL ? "الولاء" : "Loyalty"}</TabsTrigger>
          <TabsTrigger value="social"''',
              'settings tab',
          )
          loyalty_panel = '''
        {/* LOYALTY & GIFT CARDS */}
        <TabsContent value="loyalty" className="mt-4">
          <Card className="border-border/60">
            <CardHeader><CardTitle className="text-base flex items-center gap-2"><Gift className="size-4 text-primary" />{isRTL ? "سياسة الولاء وبطاقات الهدايا" : "Loyalty & Gift-Card Policy"}</CardTitle></CardHeader>
            <CardContent className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 rounded-lg border border-border p-3">
                <ToggleRow label={isRTL ? "تفعيل برنامج الولاء" : "Enable loyalty program"} checked={Boolean(form.loyaltyEnabled)} onChange={(v) => set("loyaltyEnabled", v)} />
                <ToggleRow label={isRTL ? "تفعيل بطاقات الهدايا" : "Enable gift cards"} checked={Boolean(form.giftCardEnabled)} onChange={(v) => set("giftCardEnabled", v)} />
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                <Field label={isRTL ? "نقاط لكل وحدة عملة" : "Points per currency unit"} value={String(form.loyaltyPointsPerCurrencyUnit ?? 1)} onChange={(v) => set("loyaltyPointsPerCurrencyUnit", parseInt(v) || 0)} dir="ltr" type="number" />
                <Field label={isRTL ? "نقاط مقابل وحدة خصم" : "Points per redeemed currency unit"} value={String(form.loyaltyRedemptionPointsPerCurrencyUnit ?? 100)} onChange={(v) => set("loyaltyRedemptionPointsPerCurrencyUnit", parseInt(v) || 1)} dir="ltr" type="number" />
                <Field label={isRTL ? "خطوة الاستبدال بالنقاط" : "Redemption point increment"} value={String(form.loyaltyRedemptionIncrementPoints ?? 100)} onChange={(v) => set("loyaltyRedemptionIncrementPoints", parseInt(v) || 1)} dir="ltr" type="number" />
                <Field label={isRTL ? "أقصى نسبة استبدال" : "Maximum redemption percent"} value={String(form.loyaltyMaxRedemptionPercent ?? 100)} onChange={(v) => set("loyaltyMaxRedemptionPercent", parseInt(v) || 1)} dir="ltr" type="number" />
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <Field label={isRTL ? "انتهاء البطاقة الافتراضي بالأيام (0 = بدون انتهاء)" : "Default gift-card expiry days (0 = none)"} value={String(form.giftCardDefaultExpiryDays ?? 0)} onChange={(v) => set("giftCardDefaultExpiryDays", parseInt(v) || 0)} dir="ltr" type="number" />
                <Field label={isRTL ? "قيم إصدار البطاقات المقترحة" : "Suggested gift-card issue amounts"} value={form.giftCardAmounts} onChange={(v) => set("giftCardAmounts", v)} dir="ltr" />
              </div>
              <p className="text-xs text-muted-foreground">
                {isRTL
                  ? "تُحتسب النقاط من المبلغ المؤهل بعد الخصم فقط. الضرائب والتوصيل والإكرامية لا تمنح نقاطاً. عمليات الاسترجاع تضيف حركات عكسية ولا تعيد كتابة السجل."
                  : "Points are earned from eligible merchandise after discounts. Tax, delivery, and tips do not earn points. Refunds append reversal events instead of rewriting history."}
              </p>
            </CardContent>
          </Card>
        </TabsContent>

'''
          settings_ui = replace_once(
              settings_ui,
              '''        {/* FEES */}
        <TabsContent value="fees"''',
              loyalty_panel + '''        {/* FEES */}
        <TabsContent value="fees"''',
              'settings loyalty panel',
          )
          settings_ui_path.write_text(settings_ui)

          seed_path = Path('prisma/seed.ts')
          seed = seed_path.read_text()
          seed = replace_once(
              seed,
              '''  DynamicPricingType,
  KdsLayoutType,''',
              '''  DynamicPricingType,
  GiftCardStatus,
  GiftCardTransactionType,
  LoyaltyPointEventType,
  KdsLayoutType,''',
              'seed enum imports',
          )
          seed = replace_once(
              seed,
              '''import { randomUUID } from "crypto";''',
              '''import { createHash, randomUUID } from "crypto";''',
              'seed crypto import',
          )
          seed = replace_once(
              seed,
              '''    "PaymentEvent", "KdsOutboxEvent", "AuditEvent", "StaffSession", "RateLimitCounter",''',
              '''    "LoyaltyPointEvent", "GiftCardTransaction", "PaymentEvent", "KdsOutboxEvent", "AuditEvent", "StaffSession", "RateLimitCounter",''',
              'seed cleanup ledgers',
          )
          seed = replace_once(
              seed,
              '''  for (const c of custs) { const r = await db.customer.create({ data: c }); custMap[c.phone] = r.id; }''',
              '''  for (const c of custs) {
    const r = await db.customer.create({
      data: { ...c, loyaltyPoints: 0 },
    });
    custMap[c.phone] = r.id;
    if (c.loyaltyPoints > 0) {
      await db.loyaltyPointEvent.create({
        data: {
          id: `seed_loyalty_${uid()}`,
          idempotencyKey: `seed-loyalty-opening:${r.id}`,
          customerId: r.id,
          eventType: LoyaltyPointEventType.opening_balance,
          pointsDelta: c.loyaltyPoints,
          actorName: "Seed",
          actorRole: "system",
          reasonCode: "seed_opening_balance",
          reason: "Seeded opening loyalty balance",
          metadata: { seed: true },
        },
      });
    }
  }''',
              'seed customer ledger',
          )
          seed = replace_once(
              seed,
              '''  const gcData = [
    { code: `GC-${uid()}`, amount: 50, balance: 50, purchaserName: "Ahmed Khalil", recipientName: "Fatima Ali", message: "Happy Birthday!", template: "birthday" },
    { code: `GC-${uid()}`, amount: 100, balance: 75, purchaserName: "Omar Hassan", recipientName: "Layla Mahmoud", message: "Thank you for your business", template: "thank_you" },
    { code: `GC-${uid()}`, amount: 25, balance: 25, purchaserName: "John Smith", recipientName: "Sara Nabil", message: "", template: "classic" },
  ];
  for (const g of gcData) { await db.giftCard.create({ data: { ...g, isRedeemed: false } }); }
  console.log(`  ✓ ${gcData.length} gift cards`);''',
              '''  const gcData = [
    { reference: `GC-${uid()}`, secret: `SEED-${uid()}-A1`, amount: 50, purchaserName: "Ahmed Khalil", recipientName: "Fatima Ali", message: "Happy Birthday!", template: "birthday" },
    { reference: `GC-${uid()}`, secret: `SEED-${uid()}-B2`, amount: 100, purchaserName: "Omar Hassan", recipientName: "Layla Mahmoud", message: "Thank you for your business", template: "thank_you" },
    { reference: `GC-${uid()}`, secret: `SEED-${uid()}-C3`, amount: 25, purchaserName: "John Smith", recipientName: "Sara Nabil", message: "", template: "classic" },
  ];
  for (const g of gcData) {
    const normalized = g.secret.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    const card = await db.giftCard.create({
      data: {
        code: g.reference,
        redemptionCodeHash: createHash("sha256").update(normalized).digest("hex"),
        redemptionCodeLast4: normalized.slice(-4),
        amount: g.amount,
        amountMinor: minor(g.amount),
        balance: 0,
        balanceMinor: 0n,
        purchaserName: g.purchaserName,
        recipientName: g.recipientName,
        message: g.message,
        template: g.template,
        status: GiftCardStatus.active,
        currency: "USD",
        isRedeemed: false,
        issuedAt: new Date(),
        issuedByName: "Seed",
      },
    });
    await db.giftCardTransaction.create({
      data: {
        id: `seed_gift_tx_${uid()}`,
        idempotencyKey: `seed-gift-card-issue:${card.id}`,
        giftCardId: card.id,
        transactionType: GiftCardTransactionType.issue,
        amountMinor: minor(g.amount),
        actorName: "Seed",
        actorRole: "system",
        reasonCode: "seed_issue",
        reason: "Seeded gift-card issue",
        metadata: { seed: true },
      },
    });
  }
  console.log(`  ✓ ${gcData.length} gift cards with immutable issue transactions`);''',
              'seed gift-card ledger',
          )
          seed_path.write_text(seed)
          PY

          rm .github/workflows/apply-loyalty-schema-wiring.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            prisma/schema.prisma \
            prisma/seed.ts \
            src/lib/db.ts \
            src/lib/auth/roles.ts \
            src/lib/auth/guard.ts \
            src/app/api/settings/route.ts \
            src/components/admin/tabs/SettingsTab.tsx \
            .github/workflows/apply-loyalty-schema-wiring.yml
          git commit -m "feat: wire loyalty and gift-card schema"
          git push origin HEAD:agent/p1-loyalty-gift-cards
